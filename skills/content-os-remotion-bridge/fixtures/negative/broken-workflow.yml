    - remotion-src/src/Root.tsx
  mapping_ref: references/api-map.md
steps:
  - step: setup
    state: gate-passed
  - step: plan
    state: gate-passed
  - step: lint
    state: gate-passed # step-out-of-order: lint (index 1) after plan (index 2)
  - step: translate
    state: done # missing-gate: state "done" not in valid set (pending|in-progress|gate-passed|user-approved)
  - step: validate
    state: gate-passed
  - step: finalize
    state: gate-passed # no-translation + silent-divergence: finalize gate passed with translated=false and validation_passed=false
