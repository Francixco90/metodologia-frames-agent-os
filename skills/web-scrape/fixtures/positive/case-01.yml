# Positive fixture — fail-closed scrape scenario with explicit user confirmation.
schemaVersion: web-scrape-v1
case: El usuario pide scrapear una página pública y confirma explícitamente el lanzamiento del navegador y la fetch de red; la skill describe el plan, emite el artefacto local estructurado y registra procedencia.
user_intent: 'Extrae los titulares y URLs de la primera página de Hacker News a un artefacto JSON local.'
input:
  url: 'https://news.ycombinator.com/'
  extraction:
    type: schema
    fields:
      items:
        - rank
        - title
        - url
        - points
  output_format: json
  depth: one-shot
fail_closed_gates:
  - gate: browser_launch
    state: requires_user_confirmation
    user_confirmed: true
  - gate: network_fetch
    state: requires_user_confirmation
    user_confirmed: true
  - gate: external_tool_invocation
    state: requires_user_confirmation
    user_confirmed: true
expected_flow:
  - step: confirm_intent
    state: user-confirmed
  - step: describe_plan
    state: plan-documented
  - step: launch_browser
    state: user-authorized
  - step: fetch_page
    state: user-authorized
  - step: extract
    state: selector-matched
  - step: emit_artifact
    state: local-artifact-written
output_contract:
  artifact_path: 'skills/web-scrape/fixtures/out/hn-frontpage.json'
  format: json
  shape: '{ "items": [...], "count": N }'
  source_id: required
  raw_sha256: required
  stdout_only: false
out_of_scope:
  - mutating_actions
  - auth_flows
  - multi_page_crawl
validation: node skills/web-scrape/scripts/check-skill.mjs
