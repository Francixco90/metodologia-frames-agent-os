<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Frames ContentOS creative — branded reveal ground truth (offline-first)</title>
    <!--
      Brand tokens via semantic CSS custom properties (resolved from BrandProfileV2
      offline, not from a CDN). System fonts (no Google Fonts). No external assets.
      Story spine: hook(0) wordmark(0.2) tagline(1.2) settle(2.6) final(3.6).
    -->
    <style>
      :root {
        /* semantic tokens — resolved offline from registries/brand/brand-profile-v2.yml */
        --brand-surface-deep: #0b1020;
        --brand-foreground-primary: #e8eefc;
        --brand-accent: #6d8bff;
        --brand-font-display: system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--brand-surface-deep);
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: var(--brand-font-display);
      }
      #cos-brand-reveal {
        position: relative;
        width: 1280px;
        height: 720px;
        background: var(--brand-surface-deep);
        color: var(--brand-foreground-primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lockup {
        text-align: center;
        will-change: transform, opacity;
      }
      #wordmark {
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
        color: var(--brand-foreground-primary);
      }
      #tagline {
        font-size: 32px;
        font-weight: 500;
        margin: 0;
        color: var(--brand-accent);
      }
    </style>
    <script src="../../../node_modules/gsap/dist/gsap.js"></script>
  </head>
  <body>
    <div
      id="cos-brand-reveal"
      data-composition-id="cos-brand-reveal"
      data-keyframe-subject="#lockup"
      data-final-state="locked"
      data-width="1280"
      data-height="720"
      data-duration="4"
      data-start="0"
    >
      <div class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div
          id="lockup"
          data-pose="hook"
          data-at="0"
          data-pose="wordmark"
          data-at="0.2"
          data-pose="tagline"
          data-at="1.2"
          data-pose="settle"
          data-at="2.6"
          data-final-state="locked"
        >
          <h1 id="wordmark">Frames ContentOS</h1>
          <p id="tagline">video desde cualquier fuente</p>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['cos-brand-reveal'] = gsap.timeline({paused: true});
      const tl = window.__timelines['cos-brand-reveal'];
      // Story spine beats: hook -> wordmark -> tagline -> settle (final lock)
      // fromTo absolute from-states, finite repeats only, no external assets
      tl.fromTo(
        '#wordmark',
        {opacity: 0, y: 40},
        {opacity: 1, y: 0, duration: 0.8, ease: 'power2.out'},
        0,
      );
      tl.fromTo(
        '#tagline',
        {opacity: 0, y: 20},
        {opacity: 1, y: 0, duration: 0.6, ease: 'power2.out'},
        1.2,
      );
      tl.fromTo('#lockup', {scale: 1}, {scale: 1.02, duration: 0.5, ease: 'sine.inOut'}, 2.6);
      tl.fromTo('#lockup', {scale: 1.02}, {scale: 1, duration: 0.4, ease: 'sine.inOut'}, 3.1);
      tl.set('#lockup', {autoAlpha: 1}, 3.6);
    </script>
  </body>
</html>
