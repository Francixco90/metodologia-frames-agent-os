schema_version: 1
receipt_id: RCP-H03-CONTENT-OS-CREATIVE-001
scope: local-evaluation
lockfile_ref: pnpm-lock.yaml
pnpm_lock_sha256: ab6af5ef32bb5fdc916ced36cd0922e4bf4e4fe1dfee3a58dddf74ebbed259bd
central_license_receipts:
  - receipts/dependency-audits/H03-LIC-GSAP-001.yml
packages:
  - {name: gsap, version: 3.15.0, license_state: allowed_scoped}
brand_integration:
  router: skills/metodologia-brand-router/SKILL.md
  brand_profile: registries/brand/brand-profile-v2.yml
  voice_profile: registries/brand/voice-profile-v2.yml
  channel_profile: registries/brand/source-bundle-v1.yml
  adaptation_decision: registries/brand/brand-adaptation-decision-v1.yml
out_of_scope_runtimes:
  - {name: three.js, reason: 'requires external assets + GPU runtime; offline-first violation'}
  - {
      name: lottie,
      reason: 'requires After Effects JSON assets + dotLottie player; external asset dependency',
    }
  - {name: anime.js, reason: 'not pinned; use GSAP default instead'}
  - {name: typegpu/webgpu, reason: 'GPU compute runtime; non-deterministic offline render path'}
out_of_scope_assets:
  - {name: google-fonts-cdn, reason: 'external font CDN; use offline brand bundle or system fonts'}
  - {
      name: external-image-urls,
      reason: 'external assets; resolve in inbox (source-lock) or author SVG/CSS',
    }
runtime_rules:
  explicit_frame: true
  network_allowed: false
  autonomous_clock_allowed: false
  fallback_must_be_observable: true
  seek_safe_bidirectional: true
  no_relative_tweens: true
  finite_repeats_only: true
  brand_truth_via_router: true
  no_lazy_web_defaults: true
  offline_fonts_only: true
production_runtime_status: local_capability_only
publication_authority: false
