name: media-rembg positive — describe then request confirmation
scenario: >
  El usuario pide quitar el fondo de photo.jpg. La habilidad describe la
  capability de rembg (recorte con transparencia, modelo por defecto,
  salida photo_rembg.png junto al original) y solicita confirmación
  explícita antes de cualquier ejecución del binario o instalación del
  entorno. No invoca rembg, no instala, no descarga modelos.
expected_behavior: >
  Se describe la capability, se lista lo que se ejecutaría tras confirmación,
  se pide confirmación explícita. Sin auto-run del binario ni auto-install.
