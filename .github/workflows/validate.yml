name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI valida contratos y código. Los smoke tests audiovisuales de skills usan
      # el FFmpeg fijado abajo; render/Chromium completos permanecen en local-full.
      METODOLOGIA_TOOLCHAIN_PROFILE: ci-code-only
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: check:repo resolves BASELINE_COMMIT via git ls-tree.
          # A shallow clone (default fetch-depth=1) lacks the baseline object → "fatal: not a tree object".
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install audiovisual probe runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr
          ffmpeg -version
          ffprobe -version
          tesseract --version
      - run: pnpm install --frozen-lockfile
      # The canonical public line (Francixco90/main) is the budget and ownership base in every
      # clone, exactly as resolveBudgetBase and check-ownership already prefer `upstream/main`;
      # the private fork imports that line, so measuring a PR against its own main would count
      # the whole upstream history as authored change.
      - name: Fetch canonical upstream main
        run: git fetch --no-tags https://github.com/Francixco90/metodologia-frames-agent-os.git +refs/heads/main:refs/remotes/upstream/main
      - name: Resolve budget base (pull requests only)
        id: base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git merge-base HEAD upstream/main)" >> "$GITHUB_OUTPUT"
      # One step, one truth: CI runs the same aggregate gate as `pnpm verify` locally.
      # scripts/check-ci-parity.ts fails check:repo if this workflow ever drifts from it.
      - run: pnpm verify
        env:
          BUDGET_BASE_REF: ${{ steps.base.outputs.sha }}
