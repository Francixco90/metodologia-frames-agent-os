name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI valida contratos y código. Los smoke tests audiovisuales de skills usan
      # el FFmpeg fijado abajo; render/Chromium completos permanecen en local-full.
      METODOLOGIA_TOOLCHAIN_PROFILE: ci-code-only
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: check:repo resolves BASELINE_COMMIT via git ls-tree.
          # A shallow clone (default fetch-depth=1) lacks the baseline object → "fatal: not a tree object".
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install audiovisual probe runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr
          ffmpeg -version
          ffprobe -version
          tesseract --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Install offline HTML browser sensor
        run: pnpm exec playwright install --with-deps chromium
      # Bind each PR to its own remote main; public/private histories stay separate.
      - name: Resolve reviewed base (pull requests only)
        id: base
        if: github.event_name == 'pull_request'
        env:
          REVIEWED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "sha=$REVIEWED_BASE_SHA" >> "$GITHUB_OUTPUT"
      # One step, one truth: CI runs the same aggregate gate as `pnpm verify` locally.
      # scripts/check-ci-parity.ts fails check:repo if this workflow ever drifts from it.
      - run: pnpm verify
        env:
          BUDGET_BASE_REF: ${{ steps.base.outputs.sha }}
          OWNERSHIP_BASE_REF: ${{ steps.base.outputs.sha }}
