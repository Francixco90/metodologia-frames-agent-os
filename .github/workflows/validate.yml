name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI valida contratos y código. El gate audiovisual permanece local-full porque
      # el runner no garantiza la versión exacta de FFmpeg ni el perfil Chromium fijado.
      METODOLOGIA_TOOLCHAIN_PROFILE: ci-code-only
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: check:repo resolves BASELINE_COMMIT via git ls-tree.
          # A shallow clone (default fetch-depth=1) lacks the baseline object → "fatal: not a tree object".
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - run: pnpm verify:contributions
      - run: pnpm verify:skills
      - run: pnpm verify:content-os
      - run: pnpm verify:ai-runtime
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
