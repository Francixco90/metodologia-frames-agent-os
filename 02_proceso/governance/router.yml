schema_version: 1
manifest_id: router-v1
source_of_truth: true # CLAUDE.md/GEMINI.md are shared agent-CLI adapters pointing here. [CONFIG]
experience_policy_ref: '02_proceso/governance/experience-first-orchestration.md'
workflow_management:
  sequence: [receive, understand, route_lock, auto_prime, work_order, invoke, verify, human_gate]
  brief_first: true
  blocking_questions_max: 3
  commands_read_only: ['/menu', '/ruta']
  skill_execution_requires_material_receipt: true
  unknown_blocks: true
productive_handlers:
  R0: {status: active, effect: read_only}
  R1: {status: coverage_gap, effect: none}
  R2: {status: coverage_gap, effect: read_only}
  R3: {status: coverage_gap, effect: none}
  R3-LOOSE: {status: coverage_gap, effect: none}
  R4: {status: active, effect: read_only, requires: hash_bound_lineage}
  R5: {status: coverage_gap, effect: none}
  R6:
    {
      status: active,
      effect: local_reversible,
      stop: EXP_BRIEF_APPROVED,
      unknown_design_authority: block,
    }
  R7: {status: active, effect: local_reversible, stop: EXP_BRIEF_APPROVED}
  R8: {status: active, effect: local_reversible, stop: LX_BRIEF_APPROVED}
  R9: {status: active, effect: local_reversible, stop: HM_CHANGE_APPROVED}
  R10: {status: active, effect: external_gated, stop: NLM_PLAN_APPROVED}
# El First-Turn Gateway clasifica asistencia, acción, reanudación o ambigüedad;
# este manifiesto R0-R10 conserva la autoridad de routing. Los adapters solo
# ejecutan una ruta cuando su handler es resoluble. [CONFIG]
#
# Estados de tarea (task-contract.ts): INTAKE, ESPECIFICADO, COMPILADO, EVALUADO,
# ENTREGADO, BLOQUEADO. El enum `created_from_route` valida R0-R10. [CÓDIGO]
#
# Gates G13-G17 y MW_BRIEF_APPROVED son manuales fail-closed (dag.yml: release.human_gate G15,
# readiness_gate G16, publish_gate G17). No los automatices. [CONFIG]
routes:
  - id: R0
    signal: 'ambiguo'
    signal_patterns: ['ambiguo', 'sin contexto claro']
    reads: ['context.md']
    output: 'pedir dato bloqueante o coverage_gap'
    binds_to: null
  - id: R1
    signal: 'nuevo proyecto / crear proyecto'
    reads: ['01_intencion/program/dag.yml', '03_artefactos/projects/_template/project.yml']
    output: 'scaffold projects/{id}/ + registro append-only en project-registry.yml + claims-ledger.yml'
    binds_to: project
    runtime_status: coverage_gap
  - id: R2
    signal: 'retomar / continuar / nombre proyecto conocido'
    reads:
      - '04_estado/registries/projects/project-registry.yml'
      - '03_artefactos/projects/{id}/project.yml'
      - '04_estado/tasks/*/task.yaml'
      - '05_verificacion/scripts/ongoing-projects.ts'
    output: 'LIST ongoing projects + open tasks + next gate per project'
    binds_to: project
    runtime_status: coverage_gap
  - id: R3
    signal: 'tarea nueva + proyecto activo'
    reads:
      - '05_verificacion/scripts/lib/mint-task-id.ts'
      - 'task.yaml template'
      - '01_intencion/program/dag.yml'
    output: 'new tasks/{id}/task.yaml state INTAKE bound to project_id'
    binds_to: task
    runtime_status: coverage_gap
  - id: R3-LOOSE
    signal: 'tarea nueva sin proyecto'
    reads: ['05_verificacion/scripts/lib/mint-task-id.ts']
    output: 'new tasks/{id}/task.yaml with project_id: null — first-class loose task'
    binds_to: task
    runtime_status: coverage_gap
  - id: R4
    signal: 'seguir / ongoing / tarea en progreso'
    reads:
      - '04_estado/tasks/{id}/PROGRESS.md'
      - '04_estado/tasks/{id}/continuity/state.yaml'
      - '04_estado/tasks/{id}/continuity/resume.md'
    output: 'resume in-progress task'
    binds_to: task
    runtime_status: active_hash_bound_lineage
  - id: R5
    signal: 'eval / ablation'
    reads: ['05_verificacion/evals/']
    output: 'run eval or ablation variant in isolated worktree'
    binds_to: eval
    runtime_status: coverage_gap
  - id: R6
    signal: 'crear, planear, revisar o editar una pieza de contenido'
    signal_patterns:
      - 'ayúdame a generar una pieza'
      - 'crear contenido'
      - 'planear campaña'
      - 'revisar pieza'
      - 'editar contenido'
      - 'design system first'
      - 'HTML MetodologIA'
      - 'crear una ruta formativa'
      - 'crear un taller completo'
      - 'run Trainer OS'
      - 'crear video'
      - 'crear reel'
      - 'video largo'
      - 'video para YouTube'
      - 'editar testimonio'
      - 'mostrar resultados concretos'
      - 'Video OS'
      - 'explicar un método'
      - 'method explainer'
      - 'PASA'
      - 'PIVOTE'
      - 'propuesta comercial'
      - 'commercial proposal'
      - 'proposal deck'
    reads:
      - '03_artefactos/skills/content-os-router/SKILL.md'
      - '03_artefactos/skills/metodologia-trainer-os/SKILL.md'
      - '02_proceso/workflows/multimedia/_schema/content-intent-v2.schema.ts'
      - '02_proceso/workflows/multimedia/_schema/brief-v1.schema.ts'
      - '02_proceso/workflows/multimedia/_schema/commercial-proposal-v1.schema.ts'
      - '02_proceso/workflows/multimedia/_runner/commercial-proposal-profile-v1.ts'
      - '02_proceso/workflows/trainer-os/trainer-intake-v1.schema.ts'
      - '02_proceso/workflows/trainer-os/trainer-run-manifest-v1.schema.ts'
      - '02_proceso/workflows/trainer-os/runner.ts'
      - '02_proceso/workflows/video-os/context.md'
      - '02_proceso/workflows/video-os/index.ts'
      - '02_proceso/workflows/video-os/_schema/method-explainer-planning-v1.schema.ts'
      - '02_proceso/workflows/video-os/_schema/method-explainer-execution-v1.schema.ts'
      - '02_proceso/workflows/operator-core/index.ts'
      - '02_proceso/workflows/multimedia/p00-definir-sistema/workflow.yml'
      - '04_estado/registries/brand/brand-profile-v2.yml'
      - '03_artefactos/brand/tokens/brand-tokens.yml'
      - '03_artefactos/projects/notebooklm-os/metodologia-brand-content-v3/knowledge-base/30-templates/channels/30-template--commercial-proposal-deck--v1.0.md'
      - '03_artefactos/skills/content-os-slideshow/SKILL.md'
    output: 'perfil general: content-intent-v2 + brief.md + cadena adaptativa P00-P09, STOP en MW_BRIEF_APPROVED; perfil commercial-proposal R6: P00 opcional → P01 → P02 → P03 → P05 → P06 → P07, sin P04/P09; P08 bloqueado en V1 y una revisión futura exige verification REVISE + receipt durable V2; MD/HTML/JSON/CSV y techo RENDERED_DRAFT; perfil Video OS: V00-V04 spec-first con principal antes de derivados, STOP en VO_DIRECTION_APPROVED; perfil method-explainer candidate/coverage_gap: planifica intent → assumptions → method model → beat budget → diagram contract → build manifest embebido sin self-hash → unattended state y exige source-pack, spec, debate, guion, captions, audio, storyboard, asset-manifest, render-plan, verification, receipts, contact-sheet, review, handoff, renderA, renderB y MP4 principal hash-bound; STOP real en VO_DIRECTION_APPROVED, sin afirmar compile/render/runtime activo ni superar RENDERED_DRAFT; perfil Trainer OS candidate: intake → route spec → exactamente 2 direcciones, luego STOP en EXP_BRIEF_APPROVED; para Trainer compile/verify/RENDERED_DRAFT siguen coverage_gap hasta evaluación y promoción, sin publicar'
    binds_to: task
    runtime_status: active_brief_first
  - id: R7
    signal: 'crear CV, carta, buscar empleo, postular o continuar candidatura'
    signal_patterns:
      - 'crear CV'
      - 'hoja de vida'
      - 'cover letter'
      - 'buscar empleo'
      - 'buscar vacantes'
      - 'LinkedIn'
      - 'postular'
      - 'continuar candidatura'
    reads:
      - '01_intencion/career/career-os-operating-contract-v2.md'
      - '03_artefactos/skills/career-application-orchestrator/SKILL.md'
      - '02_proceso/workflows/career/_schema/intent-v1.schema.ts'
      - '02_proceso/workflows/career/_schema/brief-v1.schema.ts'
      - '02_proceso/workflows/operator-core/index.ts'
    output: 'career-intent-v1 + brief.md + cadena adaptativa C00-C09; autoridad v2 con coverage_gap A1 para migración material; Operator Core solo aporta planificación determinista compartida; C09 hace STOP material en CR_PACKAGE_APPROVED; CR_SUBMISSION_AUTHORIZED pertenece a una fase posterior y exige receipt material one-use'
    binds_to: task
    runtime_status: active_brief_first
  - id: R8
    signal: 'crear, ampliar, corregir o retirar una extensión privada de Frames'
    signal_patterns:
      - 'crear una skill local'
      - 'crear un workflow privado'
      - 'extender Frames localmente'
      - 'corregir extensión local'
    reads:
      - '02_proceso/workflows/local-extensions/contracts.ts'
      - '02_proceso/workflows/local-extensions/executor-v1.ts'
      - '02_proceso/workflows/skill-systems/contracts.ts'
      - '03_artefactos/skills/frames-local-extension-foundry/SKILL.md'
      - '03_artefactos/projects/agentic-workflow-adoption-v1/local-extensions/technical-defense/extension.yml'
    output: 'brief local + L00-L05 con S00-S07; recomienda PROJECT_LOCAL si falta scope; código activo solo mediante LocalExtensionExecutorV1 + TransactionKernelV1, sandbox hash-bound y network DENIED; technical-defense queda ACTIVE_LOCAL y no crea ruta global; STOP en LX_BRIEF_APPROVED'
    binds_to: task
    runtime_status: active_brief_first
  - id: R9
    signal: 'corregir, evolucionar, migrar o deprecar el arnés Frames'
    signal_patterns:
      - 'corregir Frames'
      - 'mantener el arnés'
      - 'evolucionar Frames'
      - 'migrar workflow'
      - 'deprecar capacidad'
    reads:
      - '02_proceso/workflows/maintenance/_schema/workflow-v1.schema.ts'
      - '02_proceso/workflows/skill-systems/contracts.ts'
      - '02_proceso/core/contracts/documentation-governance-v1.ts'
      - '03_artefactos/skills/frames-harness-maintainer/SKILL.md'
    output: 'impact plan + M00-M06 con S00-S09; STOP en HM_CHANGE_APPROVED'
    binds_to: task
    runtime_status: active_brief_first
  - id: R10
    signal: 'crear, auditar, curar, sincronizar u operar NotebookLM OS'
    signal_patterns:
      - 'NotebookLM OS'
      - 'NotebookLM'
      - 'Gemini Notebook'
      - '/notebooklm:init'
      - '/notebooklm:audit'
      - '/notebooklm:studio'
    reads:
      - '02_proceso/workflows/notebooklm-os/README.md'
      - '02_proceso/core/contracts/notebooklm-os-v1.ts'
      - '03_artefactos/adapters/notebooklm-managed/contract.yml'
      - '03_artefactos/skills/notebooklm-os-router/SKILL.md'
    output: 'NotebookIntentV1 + NotebookPlanV1 + cadena N00-N09; lectura y planificación sin mutación; STOP en NLM_PLAN_APPROVED o el gate específico del efecto'
    binds_to: task
    runtime_status: active_plan_first_external_fail_closed
# `commands.yaml` es la única autoridad para comando, owner, manualidad,
# idempotencia y fail-closed de cada gate. El router solo conserva semántica de ruta. [CONFIG]
