# Multi-format size budgets. Changed files must resolve one effective rule;
# target overruns warn and hard overruns fail. [CONFIG]
schema_version: file-budget-policy-v2
manifest_id: file-budget-policy-v2
defaults: {kind: authored, scope: changed, mode: enforce, changed_mode: enforce}
pr_budget: {target_files: 8, target_loc: 800, hard_files: 12, hard_loc: 1200}
change_program_manifest: '03_artefactos/projects/agentic-workflow-adoption-v1/change-budget-program-v1.json'

budgets:
  - surface: notebooklm-brand-content-v1-governed-package
    kind: exempt
    match: '03_artefactos/projects/notebooklm-os/metodologia-brand-content/**'
    target: {}
    hard: {}
    rationale: 'The private brand-content package (source packs, gallery, knowledge base) is governed by verify:notebooklm-os hash-bound source registries and LFS-managed binaries; per-file prose length is not the control.'
  - surface: notebooklm-canon-v3-governed-package
    kind: exempt
    match: '03_artefactos/projects/notebooklm-os/metodologia-brand-content-v3/**'
    target: {}
    hard: {}
    rationale: 'The private Canon v3 package has a stricter domain validator: 33,682 normalized-word cap, 25% containment limit, exact 107-source hash readback, prompt parity and bounded source selection.'
  - surface: generated-workflow-documentation
    kind: generated
    match:
      - '01_intencion/reference/workflows/*.md'
      - '03_artefactos/content/documentation/workflows/*.html'
      - '03_artefactos/content/documentation/index.html'
      - '03_artefactos/content/documentation/documentation-*.json'
    target: {max_words: 5000, max_lines: 1500}
    hard: {max_words: 7500, max_lines: 1800}
    rationale: 'Workflow pages, sequences and the aggregate manifest scale deterministically with every registered workflow.'
  - surface: generated-ecosystem-inventory
    kind: generated
    match:
      - '03_artefactos/content/documentation/ecosystem-inventory-v1.json'
      - '03_artefactos/content/documentation/ecosystem-inventory.md'
      - '03_artefactos/content/documentation/ecosystem-inventory.html'
      - '04_estado/registries/skills/mutation-profile-registry.yml'
    target: {max_words: 12000, max_lines: 6100}
    hard: {max_words: 24000, max_lines: 6500}
    rationale: 'Complete inventories are generated, drift-checked and intentionally scale with governed ecosystem cardinality.'
  - surface: user-facing-explanatory-documentation
    kind: exempt
    match:
      - README.md
      - 01_intencion/guides/README.md
      - 01_intencion/guides/capabilities.md
      - 01_intencion/guides/guided-use.md
      - 01_intencion/guides/content-multimedia.md
      - 01_intencion/guides/career.md
      - 01_intencion/guides/technical-reference.md
      - 01_intencion/guides/extend-frames.md
      - 01_intencion/guides/maintain-frames.md
    target: {}
    hard: {}
    rationale: 'A closed registry exempts only reader-facing explanations so utility and comprehension take precedence over per-file length.'
  - surface: generated-context-projection
    kind: generated
    match: ['context.md', '**/context.md']
    target: {max_lines: 80}
    hard: {max_lines: 120}
    rationale: 'Public context surfaces are deterministic projections of the canonical sharded registry.'
  - surface: context-surface-registry
    match: '02_proceso/governance/context-surfaces/*.yml'
    target: {max_words: 3500, max_lines: 500}
    hard: {max_words: 6000, max_lines: 800}
    rationale: 'Shards preserve the complete 49-surface graph while keeping each authority independently reviewable.'
  - surface: generated-documentation-inventory
    kind: exempt
    match: '01_intencion/program/documentation-inventory-v1.json'
    target: {}
    hard: {}
    rationale: 'The deterministic full-corpus inventory is governed by docs:audit drift and schema checks.'
  - surface: generated-multimedia-schematic
    kind: generated
    match: '02_proceso/workflows/multimedia/p*/schematic.html'
    baseline: template
    target: {multiplier: 1}
    hard: {multiplier: 2}
    rationale: 'P00-P09 schematics are deterministic projections of one governed HTML template.'
  - surface: generated-multimedia-artifact-contract
    kind: generated
    match:
      [
        '02_proceso/workflows/multimedia/_schema/artifacts/**',
        '02_proceso/workflows/multimedia/_assets/artifact-registry.md',
      ]
    target: {max_words: 800, max_lines: 100}
    hard: {max_words: 1500, max_lines: 200}
    rationale: 'Artifact schemas and their human index are deterministic projections of the deliverable registry.'
  - surface: generated-deliverable-template-markdown
    kind: generated
    match: '02_proceso/workflows/multimedia/p*/templates/*.template.md'
    target: {max_words: 900, max_lines: 180}
    hard: {max_words: 1500, max_lines: 300}
    rationale: 'Each Markdown template is a deterministic DRAFT projection of one deliverable definition and class profile.'
  - surface: generated-deliverable-template-html
    kind: generated
    match: '02_proceso/workflows/multimedia/p*/templates/*.template.html'
    target: {max_words: 1800, max_lines: 500}
    hard: {max_words: 3000, max_lines: 800}
    rationale: 'Each offline HTML template is regenerated from its canonical Markdown twin and the MetodologIA shell.'
  - surface: generated-career-template-markdown
    kind: generated
    match: '02_proceso/workflows/career/c*/templates/*.template.md'
    target: {max_words: 900, max_lines: 180}
    hard: {max_words: 1500, max_lines: 300}
    rationale: 'Career Markdown templates are deterministic DRAFT projections of the career deliverable registry.'
  - surface: generated-career-template-html
    kind: generated
    match: '02_proceso/workflows/career/c*/templates/*.template.html'
    target: {max_words: 1800, max_lines: 500}
    hard: {max_words: 3000, max_lines: 800}
    rationale: 'Career HTML templates are deterministic offline projections of their canonical Markdown twins.'
  - surface: generated-experience-blueprint-html
    kind: generated
    match: '03_artefactos/content/experience/frames-experience-blueprint.html'
    target: {max_words: 1800, max_lines: 500}
    hard: {max_words: 3000, max_lines: 800}
    rationale: 'The Experience HTML blueprint is regenerated deterministically from its canonical Markdown model.'
  - surface: generated-experience-projection-manifest
    kind: generated
    match: '03_artefactos/content/experience/projection-manifest.json'
    target: {max_words: 500, max_lines: 200}
    hard: {max_words: 1000, max_lines: 400}
    rationale: 'The projection manifest is emitted by the same renderer and remains hash-bound to the blueprint.'
  - surface: generated-host-adapter-projection
    kind: generated
    match:
      [
        '.agents/plugins/marketplace.json',
        '.agents/skills/frames-assist/SKILL.md',
        '.claude/commands/frames/assist.md',
        '.claude/skills/frames-assist/SKILL.md',
        '.gemini/commands/frames/assist.toml',
      ]
    target: {max_words: 500, max_lines: 150}
    hard: {max_words: 800, max_lines: 250}
    rationale: 'Host adapter projections are regenerated from one portable package manifest.'
  - surface: generated-bound-output
    kind: generated
    match: '03_artefactos/brand/generated/**'
    baseline: template
    target: {multiplier: 1}
    hard: {multiplier: 2}
    rationale: 'Generated outputs require a declared size-comparable template.'
  - surface: generated-ledger-projection
    kind: exempt
    match:
      [
        '01_intencion/program/file-disposition-ledger.yml',
        '01_intencion/program/file-disposition-ledger.md',
        'docs/program/file-disposition-ledger.yml',
        'docs/program/file-disposition-ledger.md',
      ]
    target: {}
    hard: {}
    rationale: 'Self-validating paired projections are governed by deterministic regeneration.'
  - surface: generated-explicit-fallback
    kind: generated
    fallback: true
    match: '**'
    target: {max_words: 2000, max_lines: 500}
    hard: {max_words: 4000, max_lines: 1000}
    rationale: 'Unbound generated outputs receive explicit conservative caps until a template binding exists.'
  - surface: vendor-import
    kind: exempt
    match: '03_artefactos/skills/vendor/**'
    target: {}
    hard: {}
    changed_mode: report
    rationale: 'Vendored bytes use provenance and import receipts, not authored caps.'
  - surface: immutable-runtime-evidence
    kind: exempt
    match:
      [
        '04_estado/receipts/**',
        '05_verificacion/quality/reports/**',
        '05_verificacion/quality/reviews/**',
        '02_proceso/committees/creation/**',
      ]
    target: {}
    hard: {}
    changed_mode: report
    rationale: 'Append-only evidence uses hashes and immutability checks.'
  - surface: local-cabin
    kind: exempt
    match: [CONTEXT.md, work/private/CONTEXT.md, TASK.md, PROJECT.md]
    target: {}
    hard: {}
    changed_mode: report
    rationale: 'Gitignored task cabins are runtime context, not versioned authored corpus.'
  - surface: baseline-root-doc
    match: [README.md, AGENTS.md]
    baseline: file-disposition
    target: {multiplier: 1.5}
    hard: {multiplier: 2}
    rationale: 'Root documents retain their approved per-file baseline.'
  - surface: agent-cli-adapter
    match: [CLAUDE.md, GEMINI.md]
    target: {max_words: 1000, max_lines: 150}
    hard: {max_words: 2500, max_lines: 400}
    rationale: 'Shared CLI adapters use the governance-document budget.'
  - surface: SKILL.md
    match: '03_artefactos/skills/**/SKILL.md'
    exclude: ['03_artefactos/skills/vendor/**']
    target: {max_words: 800, max_lines: 180}
    hard: {max_words: 1200, max_lines: 300}
    scope: all
    mode: report
    rationale: 'Untouched debt reports; new or touched skills enforce the hard cap.'
  - surface: prompt-spec.md
    match: '**/prompt-spec.md'
    target: {max_words: 1500, max_lines: 300}
    hard: {max_words: 2200, max_lines: 400}
    scope: all
    rationale: 'Prompt specifications remain dense and reviewable.'
  - surface: authored-governance-md
    match:
      [
        '02_proceso/governance/*.md',
        '02_proceso/governance/*.yml',
        '02_proceso/governance/*.yaml',
        '02_proceso/governance/*.json',
      ]
    exclude: ['02_proceso/governance/context.md']
    target: {max_words: 1000, max_lines: 150}
    hard: {max_words: 2500, max_lines: 400}
    scope: all
    rationale: 'Governance documents use the approved density ceiling.'
  - surface: html-document-template
    match:
      [
        '02_proceso/workflows/multimedia/_assets/schematic-template.html',
        '02_proceso/workflows/multimedia/_assets/brief-document-template.html',
        '02_proceso/workflows/career/_assets/brief-template.html',
        '02_proceso/workflows/career/_assets/document-template.html',
      ]
    target: {max_lines: 400}
    hard: {max_lines: 800}
    rationale: 'HTML templates use the approved document-specific ceiling.'
  - surface: experience-blueprint-source
    match: '03_artefactos/content/experience/frames-experience-blueprint.md'
    target: {max_words: 1800, max_lines: 250}
    hard: {max_words: 2500, max_lines: 400}
    rationale: 'The canonical Experience blueprint remains comprehensive but independently reviewable.'
  - surface: experience-control-assets
    match:
      [
        '02_proceso/workflows/experience/component-registry.yml',
        '02_proceso/workflows/experience/microcopy.es.yml',
        '02_proceso/workflows/experience/service-blueprint.yml',
      ]
    target: {max_words: 1000, max_lines: 250}
    hard: {max_words: 1800, max_lines: 400}
    rationale: 'Allowlisted components, microcopy and service choreography stay concise and auditable.'
  - surface: experience-release-manifest
    match: '04_estado/releases/experience/**/release-manifest.json'
    target: {max_words: 800, max_lines: 300}
    hard: {max_words: 1500, max_lines: 500}
    rationale: 'Approved release manifests preserve bounded hashes, compatibility and evidence.'
  - surface: experience-release-guidance
    match:
      [
        '04_estado/releases/experience/**/compatibility.md',
        '04_estado/releases/experience/**/migration.md',
        '04_estado/releases/experience/**/restore.md',
      ]
    target: {max_words: 500, max_lines: 150}
    hard: {max_words: 1000, max_lines: 300}
    rationale: 'Release compatibility, migration and restore instructions stay operationally dense.'
  - surface: career-deliverable-registry
    match: '02_proceso/workflows/career/_assets/deliverable-registry.yml'
    target: {max_words: 2500, max_lines: 500}
    hard: {max_words: 5000, max_lines: 800}
    rationale: 'The complete 33-deliverable Career registry stays reviewable as one canonical matrix.'
  - surface: multimedia-deliverable-registry
    match: '02_proceso/workflows/multimedia/_assets/deliverable-definition-registry.yml'
    target: {max_words: 4000, max_lines: 650}
    hard: {max_words: 6000, max_lines: 800}
    rationale: 'The 39-entry canonical catalog stays reviewable as one complete cross-workflow matrix.'
  - surface: authored-decisions-md
    match: '01_intencion/adrs/*.md'
    target: {max_words: 500, max_lines: 50}
    hard: {max_words: 1000, max_lines: 120}
    scope: all
    rationale: 'ADRs preserve the 50-line norm and 120-line hard cap.'
  - surface: harness-creator-references
    match: '03_artefactos/skills/**/references/*.md'
    exclude: ['03_artefactos/skills/vendor/**']
    target: {max_words: 800, max_lines: 150}
    hard: {max_words: 1500, max_lines: 300}
    scope: changed
    rationale: 'Skill references remain independently loadable under the existing cap.'
  - surface: agent-contract-yaml
    match: '02_proceso/agents/RT-*/contract.yml'
    target: {max_lines: 100}
    hard: {max_lines: 150}
    rationale: 'Agent contracts stay bounded for selective loading.'
  - surface: workflow-manifest-yaml
    match: '02_proceso/workflows/**/workflow.yml'
    target: {max_lines: 90}
    hard: {max_lines: 150}
    rationale: 'Workflow manifests remain orchestration-focused.'
  - surface: canonical-control-config
    match:
      [
        '01_intencion/program/dag.yml',
        '01_intencion/program/ownership-manifest.yml',
        '05_verificacion/scripts/commands.yaml',
      ]
    target: {max_words: 1000, max_lines: 150}
    hard: {max_words: 2500, max_lines: 450}
    rationale: 'Canonical control manifests remain bounded while accommodating the complete governed gate registry.'
  - surface: hash-bound-skill-registry
    match: '04_estado/registries/skills/creation-v3-skill-registry.yml'
    target: {max_words: 14000, max_lines: 2600}
    hard: {max_words: 20000, max_lines: 3500}
    rationale: 'The canonical H-03 registry has an explicit cap and remains hash-bound.'
  - surface: hash-bound-v2-skill-registry
    match: '04_estado/registries/skills/skill-registry.yml'
    target: {max_words: 9000, max_lines: 1800}
    hard: {max_words: 14000, max_lines: 2600}
    rationale: 'The append-only V2 skill registry has an explicit cap and independent lifecycle validation.'
  - surface: hash-bound-skill-index
    match: '05_verificacion/scripts/creation-v3-skills.json'
    target: {max_words: 1800, max_lines: 1000}
    hard: {max_words: 3000, max_lines: 1600}
    rationale: 'The generated H-03 index has explicit caps and independent hash validation.'
  - surface: test-code
    match:
      [
        '05_verificacion/tests/**/*.ts',
        '05_verificacion/tests/**/*.tsx',
        '05_verificacion/tests/**/*.mjs',
      ]
    target: {max_lines: 200}
    hard: {max_lines: 350}
    rationale: 'Tests may be broader than production modules.'
  - surface: production-code
    match: ['**/*.ts', '**/*.tsx', '**/*.mts', '**/*.mjs', '**/*.js']
    exclude:
      [
        '05_verificacion/tests/**',
        '03_artefactos/skills/vendor/**',
        'tsconfig.json',
        'vitest.config.ts',
        'eslint.config.js',
      ]
    target: {max_lines: 100}
    hard: {max_lines: 200}
    rationale: 'Production modules split before 200 lines.'
  - surface: root-repo-control
    match:
      [
        .gitignore,
        .gitattributes,
        .prettierignore,
        .prettierrc.json,
        .npmrc,
        .nvmrc,
        package.json,
        pnpm-workspace.yaml,
        tsconfig.json,
        vitest.config.ts,
        eslint.config.js,
      ]
    target: {max_words: 1000, max_lines: 150}
    hard: {max_words: 2500, max_lines: 400}
    rationale: 'Root controls use an explicit budget, not an invisible exclusion.'
  - surface: dependency-lockfile
    kind: exempt
    match: pnpm-lock.yaml
    target: {}
    hard: {}
    changed_mode: report
    rationale: 'Frozen lockfile churn is reviewed separately from authored size.'
  - surface: authored-explicit-fallback
    fallback: true
    match: '**'
    target: {max_words: 1500, max_lines: 300}
    hard: {max_words: 2500, max_lines: 500}
    rationale: 'Every other changed authored file receives an explicit conservative budget.'
