schema_version: 1
manifest_id: tool-policy-v1
policy: one-writer-per-path-respect
mutation_policy: governance-gated
source_of_truth:
  local_settings: .claude/settings.local.json
  role_contracts: 02_proceso/agents/RT-*/contract.yml
  ownership: 01_intencion/program/ownership-manifest.yml
  dag: 01_intencion/program/dag.yml
note: |
  Canonical tool-permission manifest consolidating the ad-hoc entries in
  .claude/settings.local.json (43 local-only allow rules) and the prose
  tool contracts in 02_proceso/agents/RT-*/contract.yml into one versioned
  manifest. The local settings file remains the runtime enforcement layer;
  this manifest is the governance source of truth it must converge to.
  [CONFIG] settings.local.json grants 43 Bash/MCP/Read allow entries ad-hoc;
  this manifest replaces that proliferation with role-scoped allow/deny.
roles:
  - lead
  - repo
  - sources
  - core
  - agents-committee
  - skill-foundry
  - web
  - content
  - remotion
  - static-social
  - n8n
  - qa
  - governance
  - guardian
phases:
  - intake
  - especificado
  - compilado
  - evaluado
  - entregado
  - bloqueado
rules:
  # --- 6 active owners: concrete allow/deny ---
  - role: lead
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - 'Write only within ownership-manifest allowlist for lead (README.md, AGENTS.md, CONTRIBUTING.md, SECURITY.md, docs/**, 01_intencion/career/**, registries/projects/**, registries/memory/**, projects/_template/**, projects/vs-001-source-to-campaign/project.yml, projects/pilot-carousel-001/{README.md,project.yml})'
        - 'Bash restricted to git read-only + declared local validators (pnpm check:toolchain, pnpm check:repo)'
        - 'No publish, deploy or live send. [CONFIG] RT-01 contract.forbidden'
      source_ref: 'RT-01 contract.yml tools.allowed/forbidden; ownership-manifest writers.lead'
  - role: repo
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - 'Write only within ownership-manifest allowlist for repo (package.json, pnpm-lock.yaml, tsconfig.json, eslint.config.js, .prettierrc.json, .gitignore, .nvmrc, vitest.config.ts, .github/**, scripts/**, types/**, receipts/builds/**)'
        - 'Bash restricted to toolchain + repo validators (pnpm check:toolchain, pnpm install, pnpm typecheck, pnpm lint, pnpm test, pnpm check:repo)'
        - 'No writes outside repo-config allowlist. [CONFIG] ownership-manifest writers.repo'
      source_ref: 'ownership-manifest writers.repo; dag packages A01/A13 gate G00/G04/G08_AI_RUNTIME'
  - role: qa
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - 'Write only within ownership-manifest allowlist for qa (tests/contract/**, tests/integration/**, tests/e2e/**, tests/negative/**, tests/visual/**, tests/fixtures/**, quality/reports/**, quality/reviews/**, projects/pilot-carousel-001/quality/**, receipts/dependency-audits/**)'
        - 'Bash restricted to test runners + contract validators (pnpm test, pnpm typecheck)'
        - 'Cannot grant HUMAN_APPROVED, READY or PUBLISHED. [CONFIG] derived from RT-10/QA role semantics'
      source_ref: 'ownership-manifest writers.qa; dag packages A10a/A10b/A10c gates G08_CONTRACTS/G12_QA/G13_CAROUSEL_QA'
  - role: core
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - 'Write only within ownership-manifest allowlist for core (core/**, workflows/core/**, tests/unit/core/**)'
        - 'Bash restricted to build + unit validators (pnpm typecheck, pnpm test)'
        - 'No edits to agents, skills, content or remotion paths. [CONFIG] ownership-manifest writers.core'
      source_ref: 'ownership-manifest writers.core; dag package A03 gate G08'
  - role: governance
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - 'Write only within ownership-manifest allowlist for governance (governance/**, quality/reviews/rights-accessibility-security/**, receipts/migrations/**, receipts/experience/**, 04_estado/releases/experience/**)'
        - 'Experience release recording is mechanical and APPROVED-only; governance cannot substitute for RT-09, RT-11 or H01.'
        - 'Bash restricted to read-only audits + static scanners; no live deployment'
        - 'Cannot grant HUMAN_APPROVED, READY or PUBLISHED. [CONFIG] ownership-manifest writers.governance; RT-09 contract.forbidden'
      source_ref: 'RT-09 contract.yml tools.allowed/forbidden; ownership-manifest writers.governance; dag packages A09a/A09b gates G03_PRECLEAR/G13'
  - role: guardian
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Bash]
      deny: [Edit, Write]
      conditional:
        - 'may_remediate: false — non-writer. [CONFIG] ownership-manifest non_writers.guardian'
        - 'Bash restricted to read-only validators, hash comparators and reproducible scanners'
        - 'Cannot produce, correct or overwrite candidate files; cannot act as H01. [CONFIG] RT-11 contract.forbidden'
        - 'RT-11 emits verdict bytes through its read-only task result; RT-10 is the recorder actor and persists them without reinterpretation under the governance-owned guardian/** write set. Owner names in commands.yaml govern paths; they do not collapse actor identity. [CONFIG] RT-10/RT-11 contracts; M06; ownership-manifest'
      source_ref: 'RT-11 contract.yml tools.allowed/forbidden; ownership-manifest non_writers.guardian.may_remediate=false; dag package A12 gate G14'
  # --- Source/skill/content and local build writers ---
  - role: sources
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only within ownership paths for source projections, source registry and import receipts.'
        - 'Bash restricted to hashing and pnpm check:sources/check:privacy; no network ingestion or connector mutation.'
      source_ref: 'ownership-manifest writers.sources; dag packages A02a/A02b gate G02_PRECLEAR/G02'
  - role: agents-committee
    phase: '*'
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - 'coverage_gap: full mapping requires agent-by-agent audit of RT-04..RT-08 committee roles'
      source_ref: 'ownership-manifest writers.agents-committee; dag package A04 gate G10'
  - role: skill-foundry
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only under 03_artefactos/skills/** and 04_estado/registries/skills/**.'
        - 'Bash restricted to declared skill checkers and H-03 reconciliation; no hooks, network or global installation.'
      source_ref: 'ownership-manifest writers.skill-foundry; dag package A05 gate G07'
  - role: web
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only within ownership-manifest web paths: networks/web/**, workflows/web/** and projects/vs-001-source-to-campaign/web/**.'
        - 'Bash restricted to pnpm verify:brand and pnpm web:build; G03_BRAND must PASS before a Design System First build.'
        - 'Local deterministic build only: no WebFetch, connector, deploy, publish or live send.'
      source_ref: 'ownership-manifest writers.web; dag package A06 gate G09_WEB'
  - role: content
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only within workflows/content/**, workflows/multimedia/**, workflows/career/**, workflows/experience/** and workflows/local-extensions/** plus declared content artifacts and registries/experience/**.'
        - 'workflows/multimedia/** is one atomic content-owned route, including _schema, _runner and P00-P09; renderer roles cannot write there.'
        - 'Design System First work reads approved brand profile/tokens and requires pnpm verify:brand before pnpm content:build; unresolved authority blocks.'
        - 'Career C09 is prepare-and-stop: no browser submission, connector, publish or external effect.'
        - 'Commercial proposal R6 stops at RENDERED_DRAFT; price, ROI and commitments require hash-bound commercial authority, and deck materialization requires separate human confirmation.'
        - 'PROJECT_LOCAL code runs only through LocalExtensionExecutorV1 backed by TransactionKernelV1; network, subprocess, eval, dynamic imports and direct filesystem writes are denied.'
        - 'Bash restricted to pnpm verify:brand, pnpm content:build, local typecheck, tests and deterministic workflow validators.'
      source_ref: 'ownership-manifest writers.content; dag packages A07/A07c gates G09_CONTENT/G09_CAREER'
  - role: remotion
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only within ownership-manifest remotion paths: renderers/remotion/**, renderer/component registries, render receipts, declared project remotion implementation/manifests/reviews/approvals/receipts, and tests/unit/remotion/**.'
        - 'Bash restricted to pnpm verify:brand, pnpm remotion:prepare, pnpm remotion:validate and pnpm render:all; G03_BRAND must PASS before a Design System First build.'
        - 'No writes to workflows/multimedia/**; no network fetch, connector, distribution or publish.'
      source_ref: 'ownership-manifest writers.remotion; dag package A08 gate G12'
  - role: static-social
    phase: '*'
    tools:
      allow: [Read, Grep, Glob, Edit, Write, Bash]
      deny: []
      conditional:
        - 'Write only within ownership-manifest static-social paths: renderers/static-social/**, projects/pilot-carousel-001/artifacts/** and receipts/carousel/**.'
        - 'Bash restricted to pnpm verify:brand and pnpm carousel:build; G03_BRAND must PASS before a Design System First build.'
        - 'No writes to workflows/multimedia/**; no network fetch, connector, distribution or publish.'
      source_ref: 'ownership-manifest writers.static-social; dag package A07s gate G12_CAROUSEL'
  - role: n8n
    phase: '*'
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - 'coverage_gap: full mapping requires agent-by-agent audit of n8n role'
        - 'n8n remains dry-run; no connector activation or publish. [CONFIG] AGENTS.md rule 8'
      source_ref: 'ownership-manifest writers.n8n; dag package A11 gate G11'
convergence_notes:
  - 'settings.local.json currently grants 89 ad-hoc allow entries spanning Bash, Read, MCP (notebooklm, tessl, playwright) and WebFetch. [CONFIG] This manifest is the target those grants must converge to; runtime enforcement stays in settings.local.json until the harness reads this manifest directly.'
  - 'MCP tool grants (notebooklm, tessl, playwright) are not yet role-mapped here. [SUPUESTO] MCP allowlisting will be reconciled in a follow-up governance pass once MCP usage is scoped per role.'
  - 'No Zod schema here by design; governance creates that in P5-S16. [CONFIG] task scope S3'
runtime_grants:
  # Convergence (A6): the 7 grants in settings.local.json whose tool prefix was
  # absent from every role's `tools.allow` are explicitly admitted here with
  # rationale, so `pnpm check:grants` (G20) converges to 0 unapproved. These
  # are read-only / external-tool surfaces; none grant write or publish. [CONFIG]
  - tool: WebFetch
    allowed_for: [lead, sources, governance]
    rationale: 'Read-only web fetch for skill-first source extraction and doc lookup. [CONFIG] convergence A6'
  - tool: mcp__notebooklm-mcp__notebook_list
    allowed_for: [lead, sources]
    rationale: 'Read-only NotebookLM notebook inventory for source management. [CONFIG] convergence A6'
  - tool: mcp__plugin_playwright_playwright__browser_navigate
    allowed_for: [web, qa]
    rationale: 'Headless browser navigation for carousel/visual validation. [CONFIG] convergence A6'
  - tool: mcp__plugin_playwright_playwright__browser_console_messages
    allowed_for: [web, qa]
    rationale: 'Read-only console harvest during visual validation. [CONFIG] convergence A6'
  - tool: mcp__plugin_playwright_playwright__browser_take_screenshot
    allowed_for: [web, qa]
    rationale: 'Read-only screenshot capture for visual review. [CONFIG] convergence A6'
  - tool: mcp__tessl__search
    allowed_for: [governance, skill-foundry]
    rationale: 'Read-only Tessl registry search for skill discovery. [CONFIG] convergence A6'
  - tool: mcp__tessl__status
    allowed_for: [governance, repo]
    rationale: 'Read-only Tessl auth/manifest status check. [CONFIG] convergence A6'
gaps:
  - 'coverage_gap: 2 stub owners (agents-committee and n8n) remain read-only pending agent-by-agent audit.'
  - 'coverage_gap: future Design System First output paths remain unresolved and therefore blocked until a later PR adds explicit one-writer ownership; this PR grants no wildcard outside current allowlists.'
  - 'coverage_gap: MCP tool permissions (notebooklm/tessl/playwright) admitted at runtime_grants level only; full per-role MCP allow/deny awaits the agent-by-agent audit.'
