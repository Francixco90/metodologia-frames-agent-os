schema_version: 1
manifest_id: tool-policy-v1
policy: one-writer-per-path-respect
mutation_policy: governance-gated
source_of_truth:
  local_settings: .claude/settings.local.json
  role_contracts: 02_proceso/agents/RT-*/contract.yml
  ownership: 01_intencion/program/ownership-manifest.yml
  dag: 01_intencion/program/dag.yml
note: |
  Canonical tool-permission manifest consolidating the ad-hoc entries in
  .claude/settings.local.json (43 local-only allow rules) and the prose
  tool contracts in 02_proceso/agents/RT-*/contract.yml into one versioned
  manifest. The local settings file remains the runtime enforcement layer;
  this manifest is the governance source of truth it must converge to.
  [CONFIG] settings.local.json grants 43 Bash/MCP/Read allow entries ad-hoc;
  this manifest replaces that proliferation with role-scoped allow/deny.
roles:
  - lead
  - repo
  - sources
  - core
  - agents-committee
  - skill-foundry
  - web
  - content
  - remotion
  - static-social
  - n8n
  - qa
  - governance
  - guardian
phases:
  - intake
  - especificado
  - compilado
  - evaluado
  - entregado
  - bloqueado
rules:
  # --- 6 active owners: concrete allow/deny ---
  - role: lead
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - "Write only within ownership-manifest allowlist for lead (README.md, AGENTS.md, CONTRIBUTING.md, SECURITY.md, docs/**, registries/projects/**, registries/memory/**, projects/_template/**, projects/vs-001-source-to-campaign/project.yml, projects/pilot-carousel-001/{README.md,project.yml})"
        - "Bash restricted to git read-only + declared local validators (pnpm check:toolchain, pnpm check:repo)"
        - "No publish, deploy or live send. [CONFIG] RT-01 contract.forbidden"
      source_ref: "RT-01 contract.yml tools.allowed/forbidden; ownership-manifest writers.lead"
  - role: repo
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - "Write only within ownership-manifest allowlist for repo (package.json, pnpm-lock.yaml, tsconfig.json, eslint.config.js, .prettierrc.json, .gitignore, .nvmrc, vitest.config.ts, .github/**, scripts/**, types/**, receipts/builds/**)"
        - "Bash restricted to toolchain + repo validators (pnpm check:toolchain, pnpm install, pnpm typecheck, pnpm lint, pnpm test, pnpm check:repo)"
        - "No writes outside repo-config allowlist. [CONFIG] ownership-manifest writers.repo"
      source_ref: "ownership-manifest writers.repo; dag packages A01/A13 gate G00/G04/G08_AI_RUNTIME"
  - role: qa
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - "Write only within ownership-manifest allowlist for qa (tests/contract/**, tests/integration/**, tests/e2e/**, tests/negative/**, tests/visual/**, tests/fixtures/**, quality/reports/**, quality/reviews/**, projects/pilot-carousel-001/quality/**, receipts/dependency-audits/**)"
        - "Bash restricted to test runners + contract validators (pnpm test, pnpm typecheck)"
        - "Cannot grant HUMAN_APPROVED, READY or PUBLISHED. [CONFIG] derived from RT-10/QA role semantics"
      source_ref: "ownership-manifest writers.qa; dag packages A10a/A10b/A10c gates G08_CONTRACTS/G12_QA/G13_CAROUSEL_QA"
  - role: core
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - "Write only within ownership-manifest allowlist for core (core/**, workflows/core/**, tests/unit/core/**)"
        - "Bash restricted to build + unit validators (pnpm typecheck, pnpm test)"
        - "No edits to agents, skills, content or remotion paths. [CONFIG] ownership-manifest writers.core"
      source_ref: "ownership-manifest writers.core; dag package A03 gate G08"
  - role: governance
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash, Edit, Write]
      deny: []
      conditional:
        - "Write only within ownership-manifest allowlist for governance (governance/**, quality/reviews/rights-accessibility-security/**, receipts/migrations/**)"
        - "Bash restricted to read-only audits + static scanners; no live deployment"
        - "Cannot grant HUMAN_APPROVED, READY or PUBLISHED. [CONFIG] ownership-manifest writers.governance; RT-09 contract.forbidden"
      source_ref: "RT-09 contract.yml tools.allowed/forbidden; ownership-manifest writers.governance; dag packages A09a/A09b gates G03_PRECLEAR/G13"
  - role: guardian
    phase: "*"
    tools:
      allow: [Read, Grep, Glob, Bash]
      deny: [Edit, Write]
      conditional:
        - "may_remediate: false — non-writer. [CONFIG] ownership-manifest non_writers.guardian"
        - "Bash restricted to read-only validators, hash comparators and reproducible scanners"
        - "Cannot produce, correct or overwrite candidate files; cannot act as H01. [CONFIG] RT-11 contract.forbidden"
        - "Writes (verdicts/reports) land in guardian/** via a separate writer delegation, not Guardian's own Edit/Write. [SUPUESTO] pending Guardian write-path clarification"
      source_ref: "RT-11 contract.yml tools.allowed/forbidden; ownership-manifest non_writers.guardian.may_remediate=false; dag package A12 gate G14"
  # --- 8 stub owners: gap, full mapping requires agent-by-agent audit ---
  - role: sources
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of RT-02/RT-03 source roles"
      source_ref: "ownership-manifest writers.sources; dag packages A02a/A02b gate G02_PRECLEAR/G02"
  - role: agents-committee
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of RT-04..RT-08 committee roles"
      source_ref: "ownership-manifest writers.agents-committee; dag package A04 gate G10"
  - role: skill-foundry
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of skill-foundry role"
      source_ref: "ownership-manifest writers.skill-foundry; dag package A05 gate G07"
  - role: web
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of web role"
      source_ref: "ownership-manifest writers.web; dag package A06 gate G09_WEB"
  - role: content
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of content role"
      source_ref: "ownership-manifest writers.content; dag package A07 gate G09_CONTENT"
  - role: remotion
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of remotion role"
      source_ref: "ownership-manifest writers.remotion; dag package A08 gate G12"
  - role: static-social
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of static-social role"
      source_ref: "ownership-manifest writers.static-social; dag package A07s gate G12_CAROUSEL"
  - role: n8n
    phase: "*"
    tools:
      allow: [Read, Grep, Glob]
      deny: []
      conditional:
        - "coverage_gap: full mapping requires agent-by-agent audit of n8n role"
        - "n8n remains dry-run; no connector activation or publish. [CONFIG] AGENTS.md rule 8"
      source_ref: "ownership-manifest writers.n8n; dag package A11 gate G11"
convergence_notes:
  - "settings.local.json currently grants 43 ad-hoc allow entries spanning Bash, Read, MCP (notebooklm, tessl, playwright) and WebFetch. [CONFIG] This manifest is the target those grants must converge to; runtime enforcement stays in settings.local.json until the harness reads this manifest directly."
  - "MCP tool grants (notebooklm, tessl, playwright) are not yet role-mapped here. [SUPUESTO] MCP allowlisting will be reconciled in a follow-up governance pass once MCP usage is scoped per role."
  - "No Zod schema here by design; governance creates that in P5-S16. [CONFIG] task scope S3"
gaps:
  - "coverage_gap: 8 stub owners (sources, agents-committee, skill-foundry, web, content, remotion, static-social, n8n) lack concrete allow/deny; requires agent-by-agent audit of RT-02..RT-08 contracts."
  - "coverage_gap: Guardian write-path for verdicts/reports unclear — ownership-manifest lists guardian/** under writers.guardian yet non_writers.guardian.may_remediate=false. Reconcile in P5."
  - "coverage_gap: MCP tool permissions (notebooklm/tessl/playwright) not role-mapped in this pass."