  - context_id: CTX-SKILL-CAREER-ORCHESTRATOR
    root: 03_artefactos/skills/career-application-orchestrator
    kind: skill
    owner: skill-foundry
    applies_when: Un pedido Career requiere brief, reanudación, paquete o preparación de postulación.
    authority_refs:
      [
        01_intencion/career/career-os-operating-contract-v2.md,
        03_artefactos/skills/career-application-orchestrator/SKILL.md,
      ]
    load_first:
      [
        01_intencion/career/career-os-operating-contract-v2.md,
        03_artefactos/skills/career-application-orchestrator/SKILL.md,
      ]
    load_on_demand:
      [
        03_artefactos/skills/career-application-orchestrator/LINEAGE.yml,
        03_artefactos/skills/career-evidence-interviewer/SKILL.md,
        02_proceso/workflows/career/_schema/career-evidence-readiness-v1.schema.ts,
        03_artefactos/skills/candidate-evidence-reconciler/schemas/candidate-evidence-handoff-v1.schema.json,
        03_artefactos/skills/evidence-first-cv/schemas/cv-package-v3.schema.json,
      ]
    defer: [PII no autorizada, evidencia no seleccionada y C09 sin autorización]
    routes: [R7, R4]
    workflows: [C00-C09]
    primary_skills: [career-application-orchestrator]
    tools: [career_route, resume_lineage]
    read_set:
      [
        01_intencion/career/career-os-operating-contract-v2.md,
        03_artefactos/skills/career-application-orchestrator/SKILL.md,
      ]
    write_policy:
      {
        mode: generated_only,
        paths: [03_artefactos/skills/career-application-orchestrator/context.md],
      }
    gates:
      [
        CR_BRIEF_APPROVED,
        CR_CAREER_EVIDENCE_READY,
        CR_CV_DESIGN_APPROVED,
        CR_CV_SPEC_APPROVED,
        CR_CV_COMPILED,
        CR_PACKAGE_APPROVED,
        CR_SUBMISSION_AUTHORIZED,
      ]
    stop_rules:
      [
        coverage_gap A1 bloquea dependencias materiales v1,
        CR_CAREER_EVIDENCE_READY y CR_CV_COMPILED son technical STOP hasta A2/A5 y sus commands siempre terminan nonzero con COVERAGE_GAP,
        CR_PACKAGE_QA legacy no ejecutable produce coverage_gap A1_PACKAGE_QA_REFS_REQUIRED y stop,
        C06 exige spec aprobada y vigente,
        C09 sin package approval material detiene en CR_PACKAGE_APPROVED y después del approval solo prepara preview hasta CR_SUBMISSION_AUTHORIZED,
        PII y evidencia UNKNOWN bloquean,
      ]
    privacy: private_after_route_lock
    children: []
    budget: {target_lines: 80, hard_lines: 120}
