    kind: governance
    owner: governance
    applies_when: Resolver precedencia, routing, tools, budgets, privacidad o promoción.
    authority_refs: [AGENTS.md, 02_proceso/governance/router.yml]
    load_first: [AGENTS.md, 02_proceso/governance/router.yml]
    load_on_demand:
      [
        02_proceso/governance/experience-first-orchestration.md,
        02_proceso/governance/tool-policy.yml,
        02_proceso/governance/docs-budget-policy.yml,
      ]
    defer: [Políticas no afectadas y evidencia histórica]
    routes: [R0, R1, R2, R3, R3-LOOSE, R4, R5, R6, R7]
    workflows: []
    primary_skills: [content-os-router]
    tools: [policy_check]
    read_set: [02_proceso/governance/router.yml, 01_intencion/program/ownership-manifest.yml]
    write_policy: {mode: generated_only, paths: [02_proceso/governance/context.md]}
    gates: [authority, ownership, budget]
    stop_rules: [La interpretación más restrictiva prevalece]
    privacy: public_only
    children: []
    budget: {target_lines: 80, hard_lines: 120}
