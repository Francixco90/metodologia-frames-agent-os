    root: 02_proceso/workflows/documentation
    kind: workflow
    owner: content
    applies_when: Se debe explicar, proyectar o verificar una capacidad de Frames.
    authority_refs:
      [
        02_proceso/workflows/documentation/README.md,
        02_proceso/core/contracts/documentation-governance-v1.ts,
      ]
    load_first: [02_proceso/workflows/documentation/README.md]
    load_on_demand: [02_proceso/workflows/documentation/contracts.ts]
    defer: [Páginas de workflows no afectados]
    routes: [R9]
    workflows: [M05]
    primary_skills: [frames-docs-as-code]
    tools: [documentation_generator]
    read_set: [02_proceso/workflows/documentation/README.md]
    write_policy: {mode: generated_only, paths: [02_proceso/workflows/documentation/context.md]}
    gates: [DOCS_TRANSVERSAL_COMPLETE]
    stop_rules: [Derivados no se editan, Drift o referencia rota bloquea]
    privacy: public_only
    children: []
    budget: {target_lines: 80, hard_lines: 120}
  - context_id: CTX-LOCAL-EXTENSIONS
    root: 02_proceso/workflows/local-extensions
