    load_on_demand: [02_proceso/workflows/local-extensions/loader.ts]
    defer: [Extensiones no candidatas y locators privados]
    routes: [R8]
    workflows: [L00, L01, L02, L03, L04, L05]
    primary_skills: [frames-local-extension-foundry]
    tools: [local_extension_loader]
    read_set: [02_proceso/workflows/local-extensions/contracts.ts]
    write_policy: {mode: generated_only, paths: [02_proceso/workflows/local-extensions/context.md]}
    gates: [LX_BRIEF_APPROVED]
    stop_rules: [Capacidad canónica prevalece, Código sin sandbox no ejecuta]
    privacy: private_after_route_lock
    children: []
    budget: {target_lines: 80, hard_lines: 120}
