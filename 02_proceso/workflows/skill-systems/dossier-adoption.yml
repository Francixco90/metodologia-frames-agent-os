  decisions:
    - {
        proposed_id: skill-system-architect,
        disposition: KEEP,
        canonical_ids: [skill-system-architect],
        reason: La responsabilidad y los límites coinciden con S00-S02.,
        migration_note: Sin migración.,
      }
    - {
        proposed_id: skill-knowledge-distiller,
        disposition: ALIAS,
        canonical_ids: [skill-expert-distiller],
        reason: Ambos convierten práctica experta en reglas y oráculos trazables.,
        migration_note: Usar el ID canónico skill-expert-distiller.,
      }
    - {
        proposed_id: skill-contract-engineer,
        disposition: SPLIT,
        canonical_ids: [skill-system-architect, skill-authoring-engineer, skill-contract-validator],
        reason: Diseñar contratos autorarlos y verificarlos requieren owners y efectos distintos.,
        migration_note: Enrutar según diseño autoría o validación.,
      }
    - {
        proposed_id: skill-package-author,
        disposition: ALIAS,
        canonical_ids: [skill-authoring-engineer],
        reason: La autoría del paquete ya pertenece al engineer limitado por WorkOrder.,
        migration_note: Usar skill-authoring-engineer.,
      }
    - {
        proposed_id: skill-evaluation-engineer,
        disposition: KEEP,
        canonical_ids: [skill-evaluation-engineer],
        reason: El contrato TRIGGER DECISION OUTCOME y replay coincide.,
        migration_note: Sin migración.,
      }
    - {
        proposed_id: skill-security-auditor,
        disposition: ADD,
        canonical_ids: [skill-security-auditor],
        reason: El portfolio no tenía owner especializado de seguridad adversarial y supply chain.,
        migration_note: Nuevo paquete H-03 separado del validator general.,
      }
    - {
        proposed_id: skill-critical-review,
        disposition: REUSE,
        canonical_ids: [skill-portfolio-governor],
        reason: El análisis de portfolio existe y la independencia final sigue en RT-09 y RT-11.,
        migration_note: No crear una skill que suplante verifier o Guardian.,
      }
    - {
        proposed_id: skill-release-governor,
        disposition: KEEP,
        canonical_ids: [skill-release-governor],
        reason: Capsule compatibilidad rollback y retiro ya tienen owner.,
        migration_note: Sin migración.,
      }
  resulting_active_ids:
    [
      skill-system-architect,
      skill-authoring-engineer,
      skill-contract-validator,
      skill-evaluation-engineer,
      skill-portfolio-governor,
      skill-release-governor,
      skill-expert-distiller,
      skill-runtime-adapter,
      skill-security-auditor,
