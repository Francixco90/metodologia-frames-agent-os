        resource_id: PROMPT_SECURITY,
        source_refs: [Runtime/K15_ai_prompts_security.md],
        disposition: ADOPT,
        frames_owner: skill-security-auditor,
        acceptance: [Contenido no confiable no cambia autoridad permisos estado ni efectos.],
        limitation: Sin ejecución de proveedores.,
      }
    - {
        resource_id: HANDOFF_PROVENANCE,
        source_refs: [Runtime/K16_pipeline_handoffs_provenance.md],
        disposition: ADAPT,
        frames_owner: skill-authoring-engineer,
        acceptance: [Inputs outputs owners oráculos y hashes resuelven.],
        limitation: C2PA no prueba derechos ni verdad.,
      }
    - {
        resource_id: REVIEW_EVALS,
        source_refs: [Runtime/K20_review_measurement_evals.md],
        disposition: ADOPT,
        frames_owner: skill-evaluation-engineer,
        acceptance: [Gate antes de score y replay antes de claim runtime.],
        limitation: Casos descritos requieren fixtures materiales Frames.,
      }
