schema_version: skill-system-workflow-v1
workflow_id: S08
title: Empaquetar release candidate
purpose: Congelar archivos hashes compatibilidad gaps y restauración sin sobreescritura.
inputs: [skill-candidate, skill-review-report-v1, skill-change-proposal-v1]
outputs: [skill-release-capsule-v1, compatibility-report, restore-plan]
capability_map: [skill-release-governor, skill-runtime-adapter]
execution_steps:
  - {
      step_id: S01,
      purpose: Crear capsule inmutable y adapters explícitos sin sobredeclarar hosts,
      primary_skill: skill-release-governor,
      optional_skills: [skill-runtime-adapter],
      verifier: RT-11,
      inputs: [skill-candidate, skill-review-report-v1],
      outputs: [skill-release-capsule-v1, compatibility-report, restore-plan],
      gate: SSS_RELEASE_CANDIDATE,
      stop_rule: Runtime sin probe material permanece UNKNOWN.,
    }
gate: SSS_RELEASE_CANDIDATE
next_workflow: S09
stop_rule: Capsule existente no se sobrescribe.
metadata: {status: active, execution_scope: local-evaluation, external_effects: false}
