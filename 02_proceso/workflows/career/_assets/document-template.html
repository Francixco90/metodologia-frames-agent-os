<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="generator" content="MetodologIA Frames Career OS" />
    <meta name="document-id" content="{{DOCUMENT_ID}}" />
    <meta name="document-kind" content="{{KIND}}" />
    <meta name="content-sha256" content="{{CONTENT_HASH}}" />
    <meta name="spec-sha256" content="{{SPEC_HASH}}" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; font-src data:"
    />
    <title>{{TITLE}}</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #122562;
        --blue: #137dc5;
        --gold: #ffd700;
        --ink: #17223b;
        --muted: #526078;
        --line: #d7e1ed;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: #eaf2fa;
      }
      body {
        max-width: 8.27in;
        min-height: 11.69in;
        margin: 2rem auto;
        background: #fff;
        color: var(--ink);
        font:
          10.6pt/1.42 Arial,
          sans-serif;
        padding: 0.65in 0.7in;
        box-shadow: 0 16px 50px #12256220;
      }
      h1,
      h2 {
        font-family: Arial, sans-serif;
        color: var(--navy);
      }
      h1 {
        font-size: 25pt;
        line-height: 1.05;
        margin: 0 0 0.12in;
      }
      h2 {
        font-size: 12pt;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 2px solid var(--blue);
        padding-bottom: 0.05in;
        margin: 0.22in 0 0.08in;
      }
      p {
        margin: 0.06in 0;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 0.2in;
      }
      .tags {
        columns: 2;
      }
      article {
        break-inside: avoid;
      }
      article header {
        display: flex;
        justify-content: space-between;
        gap: 0.2in;
        align-items: baseline;
      }
      article h2 {
        border: 0;
        text-transform: none;
        letter-spacing: 0;
        margin: 0.1in 0;
        font-size: 11.5pt;
      }
      ul {
        margin: 0.05in 0 0.12in;
        padding-left: 0.2in;
      }
      li {
        margin: 0.03in 0;
      }
      .letter {
        font-size: 11pt;
        line-height: 1.58;
      }
      .addressee {
        font-weight: 700;
      }
      .provenance {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 8pt;
        margin-top: 0.25in;
        padding-top: 0.08in;
      }
      @media (max-width: 768px) {
        html {
          background: #fff;
        }
        body {
          margin: 0;
          min-height: auto;
          padding: 1.25rem;
          box-shadow: none;
        }
        article header {
          display: block;
        }
        .tags {
          columns: 1;
        }
      }
      @media print {
        @page {
          size: A4;
          margin: 0.55in;
        }
        html {
          background: #fff;
        }
        body {
          margin: 0;
          padding: 0;
          box-shadow: none;
          max-width: none;
          min-height: 0;
        }
        a {
          color: inherit;
          text-decoration: none;
        }
        .provenance {
          position: running(footer);
        }
      }
    </style>
  </head>
  <body data-design-profile="{{PROFILE}}">
    <header>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </header>
    <main>{{BODY}}</main>
    <footer class="provenance">{{VISIBLE_FOOTER}}</footer>
    <script id="career-document-data" type="application/json">
      {{CANONICAL_JSON}}
    </script>
  </body>
</html>
