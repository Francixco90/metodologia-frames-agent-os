schema_version: career-workflow-v1
workflow_id: C09
command: /career-submission
title: Preparación de postulación y aprendizaje
purpose: Revalidar, mostrar preview, comprobar autorización y preparar seguimiento sin enviar desde local-evaluation.
inputs: [application-package-v1, immutable-job-snapshot-v1]
deliverables:
  [
    submission-preview-v1,
    authorization-receipt-v1,
    submission-receipt-v1,
    follow-up-plan-v1,
    funnel-event-v1,
  ]
capability_map: [career-application-orchestrator]
execution_steps:
  - step_id: S01
    purpose: Revalidar vacante y hashes del package.
    inputs: [application-package-v1, immutable-job-snapshot-v1]
    primary_skill: career-application-orchestrator
    optional_skills: []
    verifier: RT-09
    outputs: [submission-preview-v1]
    template_id: TPL-C09-SUBMISSION
    gate: G14
    stop_rule: Cambio de vacante o package invalida cualquier autorización.
    context_budget: {target_files: 6, max_files: 12, target_tokens: 8000, max_tokens: 14000}
  - step_id: S02
    purpose: Validar autorización H01 de un uso y detectar intervención humana.
    inputs: [submission-preview-v1]
    primary_skill: career-application-orchestrator
    optional_skills: []
    verifier: RT-11
    outputs: [authorization-receipt-v1, follow-up-plan-v1, funnel-event-v1]
    template_id: TPL-C09-SUBMISSION
    gate: CR_SUBMISSION_AUTHORIZED
    stop_rule: CAPTCHA, OTP, términos, datos sensibles o entrevista detienen siempre.
    context_budget: {target_files: 6, max_files: 12, target_tokens: 8000, max_tokens: 14000}
gates: [G14, CR_SUBMISSION_AUTHORIZED]
next_workflow: null
template_ref: 02_proceso/workflows/career/c09-submission/templates/submission-preview-v1.template.md
stop_rule: PREPARED_STOP obligatorio; no enviar, contactar ni marcar SUBMITTED sin receipt externo material.
metadata: {status: candidate, execution_scope: local-evaluation, publication_authority: false}
