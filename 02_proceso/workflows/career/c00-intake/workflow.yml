schema_version: career-workflow-v1
workflow_id: C00
command: /career-intake
title: Intake privado del candidato
purpose: Clasificar identidad, privacidad, alcance y preguntas bloqueantes antes de crear artefactos.
inputs: [career-intent-v1]
deliverables: [candidate-intake-envelope-v1, candidate-foundation-brief-v1]
capability_map: [career-application-orchestrator]
execution_steps:
  - step_id: S01
    purpose: Normalizar intención, candidato, idioma y alcance.
    inputs: [career-intent-v1]
    primary_skill: career-application-orchestrator
    optional_skills: []
    verifier: RT-09
    outputs: [candidate-intake-envelope-v1]
    template_id: TPL-C00-INTAKE
    gate: G13
    stop_rule: Preguntar como máximo tres datos materialmente bloqueantes.
    context_budget: {target_files: 5, max_files: 10, target_tokens: 6000, max_tokens: 12000}
  - step_id: S02
    purpose: Emitir brief canónico y clasificar todo dato personal como privado.
    inputs: [candidate-intake-envelope-v1]
    primary_skill: career-application-orchestrator
    optional_skills: []
    verifier: RT-09
    outputs: [candidate-foundation-brief-v1]
    template_id: TPL-C00-INTAKE
    gate: CR_BRIEF_APPROVED
    stop_rule: No producir antes de la aprobación del brief.
    context_budget: {target_files: 6, max_files: 10, target_tokens: 8000, max_tokens: 12000}
gates: [G13, CR_BRIEF_APPROVED]
next_workflow: C01
template_ref: 02_proceso/workflows/career/c00-intake/templates/candidate-foundation-brief-v1.template.md
stop_rule: Datos reales permanecen en work/private; sin candidato resoluble, BLOCKED.
metadata: {status: candidate, execution_scope: local-evaluation, publication_authority: false}
