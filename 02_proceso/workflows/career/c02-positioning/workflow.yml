schema_version: career-workflow-v1
workflow_id: C02
command: /career-positioning
title: Posicionamiento profesional
purpose: Definir familias de rol y restricciones a partir de evidencia, no de aspiraciones tratadas como hechos.
inputs: [candidate-foundation-brief-v1, evidence-bank-v1]
deliverables: [positioning-charter-v1, role-family-map-v1, search-constraints-v1]
capability_map: [career-application-orchestrator, candidate-evidence-reconciler]
execution_steps:
  - step_id: S01
    purpose: Separar rol principal, adyacente y stretch.
    inputs: [evidence-bank-v1]
    primary_skill: career-application-orchestrator
    optional_skills: [candidate-evidence-reconciler]
    verifier: RT-09
    outputs: [role-family-map-v1]
    template_id: TPL-C02-POSITIONING
    gate: G13
    stop_rule: Stretch no puede presentarse como ajuste directo.
    context_budget: {target_files: 6, max_files: 12, target_tokens: 9000, max_tokens: 16000}
  - step_id: S02
    purpose: Fijar narrativa, mercado, idioma, ubicación y límites.
    inputs: [role-family-map-v1]
    primary_skill: career-application-orchestrator
    optional_skills: []
    verifier: RT-09
    outputs: [positioning-charter-v1, search-constraints-v1]
    template_id: TPL-C02-POSITIONING
    gate: CR_BRIEF_APPROVED
    stop_rule: El candidato aprueba posicionamiento antes de buscar o redactar.
    context_budget: {target_files: 6, max_files: 12, target_tokens: 9000, max_tokens: 16000}
gates: [G13, CR_BRIEF_APPROVED]
next_workflow: C03
template_ref: 02_proceso/workflows/career/c02-positioning/templates/positioning-charter-v1.template.md
stop_rule: Sin restricciones materiales resueltas, mantener BRIEF_DRAFT.
metadata: {status: candidate, execution_scope: local-evaluation, publication_authority: false}
