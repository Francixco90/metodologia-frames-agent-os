schema_version: career-workflow-v1
workflow_id: C03
command: /career-discovery
title: Descubrimiento de oportunidades
purpose: Preparar búsquedas y capturar oportunidades públicas con procedencia, vigencia y deduplicación.
inputs: [positioning-charter-v1, search-constraints-v1]
deliverables: [job-search-brief-v1, search-query-pack-v1, opportunity-inventory-v1]
capability_map: [career-opportunity-finder]
execution_steps:
  - step_id: S01
    purpose: Crear consultas por familias de rol y restricciones.
    inputs: [positioning-charter-v1, search-constraints-v1]
    primary_skill: career-opportunity-finder
    optional_skills: []
    verifier: RT-09
    outputs: [job-search-brief-v1, search-query-pack-v1]
    template_id: TPL-C03-DISCOVERY
    gate: G13
    stop_rule: No consultar red fuera de adapters read-only autorizados.
    context_budget: {target_files: 5, max_files: 10, target_tokens: 7000, max_tokens: 12000}
  - step_id: S02
    purpose: Capturar URL canónica, descripción y fecha observable; deduplicar.
    inputs: [search-query-pack-v1]
    primary_skill: career-opportunity-finder
    optional_skills: []
    verifier: RT-09
    outputs: [opportunity-inventory-v1]
    template_id: TPL-C03-DISCOVERY
    gate: G14
    stop_rule: Sin descripción o URL canónica, estado unknown y no shortlist.
    context_budget: {target_files: 10, max_files: 20, target_tokens: 12000, max_tokens: 22000}
gates: [G13, G14]
next_workflow: C04
template_ref: 02_proceso/workflows/career/c03-discovery/templates/job-search-brief-v1.template.md
stop_rule: LinkedIn es fuente adapter, no dependencia ni autoridad del núcleo.
metadata: {status: candidate, execution_scope: local-evaluation, publication_authority: false}
