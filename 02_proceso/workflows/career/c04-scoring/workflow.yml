schema_version: career-workflow-v1
workflow_id: C04
command: /career-score
title: Validación y scoring de vacantes
purpose: Verificar vigencia, extraer requisitos y producir un score explicable con hard stops.
inputs: [opportunity-inventory-v1, evidence-bank-v1, search-constraints-v1]
deliverables: [immutable-job-snapshot-v1, fit-scorecard-v1, ranked-shortlist-v1]
capability_map: [career-opportunity-finder, candidate-evidence-reconciler]
execution_steps:
  - step_id: S01
    purpose: Congelar la descripción y verificar vigencia.
    inputs: [opportunity-inventory-v1]
    primary_skill: career-opportunity-finder
    optional_skills: []
    verifier: RT-09
    outputs: [immutable-job-snapshot-v1]
    template_id: TPL-C04-SCORING
    gate: G13
    stop_rule: Vacante cerrada, cambiada o unknown no avanza.
    context_budget: {target_files: 8, max_files: 15, target_tokens: 10000, max_tokens: 18000}
  - step_id: S02
    purpose: Puntuar fit con pesos canónicos y blockers obligatorios.
    inputs: [immutable-job-snapshot-v1, evidence-bank-v1]
    primary_skill: career-opportunity-finder
    optional_skills: [candidate-evidence-reconciler]
    verifier: RT-09
    outputs: [fit-scorecard-v1, ranked-shortlist-v1]
    template_id: TPL-C04-SCORING
    gate: G14
    stop_rule: Requisito obligatorio no satisfecho puede bloquear pese al score.
    context_budget: {target_files: 10, max_files: 18, target_tokens: 14000, max_tokens: 22000}
gates: [G13, G14]
next_workflow: C05
template_ref: 02_proceso/workflows/career/c04-scoring/templates/fit-scorecard-v1.template.md
stop_rule: El score explica componentes; no sustituye decisión humana.
metadata: {status: candidate, execution_scope: local-evaluation, publication_authority: false}
