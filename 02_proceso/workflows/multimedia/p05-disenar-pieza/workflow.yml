schema_version: multimedia-workflow-v1
workflow_id: P05
command: /disenar-pieza
title: 'Diseña la pieza multimedia'
purpose: 'Convierte un brief aprobado en guion, secuencia, continuidad y mapa de activos.'
discipline: 'Guion y diseño multimedia'
phase: 'Diseño creativo'
tags:
  - design
  - spec
  - continuity
  - asset-map
modes:
  - id: single
    name: 'single-mode'
    description: 'Prompt executes as a single stage.'
inputs:
  - p04-calendarizar/workflow.yml
outputs:
  - artifact: 'Creative Spec'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P05-DELIVERABLE-V1
    required: true
  - artifact: 'Continuity Bible'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P05-DELIVERABLE-V1
    required: true
  - artifact: 'Asset Map'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P05-DELIVERABLE-V1
    required: true
work_product_state: SPEC_APPROVED
gates:
  - MW_SPEC_APPROVED
  - G14
next_workflow: P06
task_template_ref: task-template.yaml
prompt_spec_ref: prompt-spec.md
model:
  preferred: 'Modelo recomendado'
  alt: 'asistente general con buen manejo de contexto'
  avoid: 'generador multimedia como único decisor estratégico'
no_regression:
  - 'Checklist de no regresión'
dod:
  - 'Definition of Done'
fallback: 'Si el brief no permite escoger medio o ruta, diseña un prototipo de bajo costo: una imagen o frame, un clip corto o una prueba de voz antes de comprometer la pieza completa. interpreta, planifica, ejecuta.'
brief:
  outputs:
    - 'Especificación creativa del guion y la secuencia'
    - 'Continuidad y mapa de activos coordinados'
    - 'Prompts universales y derivados listos'
  deliverables:
    - creative-spec-v1
    - continuity-bible-v1
    - asset-map-v1
    - universal-prompts-v1
    - derivatives-v1
  context: 'Convierte un brief aprobado en guion, secuencia, continuidad y mapa de activos.'
  cta: 'Someter a MW_SPEC_APPROVED + G14; avanzar a P06 crear-activos.'
capability_map:
  skills:
    - content-os-creative
    - content-os-motion-graphics
    - content-os-remotion-bridge
    - design-compose-graphics
  assets:
    - creative-spec-v1
    - continuity-bible-v1
    - asset-map-v1
    - universal-prompts-v1
    - derivatives-v1
execution_steps:
  - step_id: S01
    purpose: 'Elegir medio y ruta creativa desde el brief aprobado.'
    inputs: [brief-campaign-map-v1, definition-of-ready-v1]
    primary_skill: content-os-creative
    optional_skills: [design-compose-graphics]
    verifier: RT-09
    outputs: [creative-spec-v1]
    template_id: TPL-P05-DELIVERABLE-V1
    gate: MW_SPEC_APPROVED
    stop_rule: 'Crear un prototipo de bajo costo si el medio no puede justificarse.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 9000, max_tokens: 15000}
  - step_id: S02
    purpose: 'Diseñar narrativa, secuencia y continuidad.'
    inputs: [creative-spec-v1, claim-register-v1]
    primary_skill: content-os-motion-graphics
    optional_skills: [content-os-creative]
    verifier: RT-09
    outputs: [continuity-bible-v1]
    template_id: TPL-P05-DELIVERABLE-V1
    gate: MW_SPEC_APPROVED
    stop_rule: 'Bloquear si la narrativa altera claims o rompe continuidad.'
    context_budget: {target_files: 10, max_files: 18, target_tokens: 11000, max_tokens: 18000}
  - step_id: S03
    purpose: 'Mapear activos, prompts y derivados.'
    inputs: [creative-spec-v1, continuity-bible-v1]
    primary_skill: design-compose-graphics
    optional_skills: [content-os-remotion-bridge]
    verifier: RT-09
    outputs: [asset-map-v1, universal-prompts-v1, derivatives-v1]
    template_id: TPL-P05-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Bloquear cualquier activo sin fuente, owner, formato o criterio de aceptación.'
    context_budget: {target_files: 10, max_files: 18, target_tokens: 12000, max_tokens: 20000}
metadata:
  source_id: MIA-MEDIA-LIB-2.0.0
  version: 2.0.0-candidato
  status: candidate
  locale:
    - es
    - en
    - pt
