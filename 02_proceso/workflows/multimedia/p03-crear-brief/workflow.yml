schema_version: multimedia-workflow-v1
workflow_id: P03
command: /crear-brief
title: 'Crea el brief o la campaña'
purpose: 'Define una pieza, sistema de derivados, serie o campaña con funciones distintas.'
discipline: 'Arquitectura editorial'
phase: 'Estrategia'
tags:
  - strategy
  - brief
  - campaign
modes:
  - id: pieza-unica
    name: 'Pieza única'
    description: 'Pieza única'
  - id: pieza-matriz-con-derivados
    name: 'Pieza matriz con derivados'
    description: 'Pieza matriz con derivados'
  - id: miniserie-de-2-4-piezas
    name: 'Miniserie de 2–4 piezas'
    description: 'Miniserie de 2–4 piezas'
  - id: campana-o-colaboracion
    name: 'Campaña o colaboración'
    description: 'Campaña o colaboración'
inputs:
  - p02-investigar/workflow.yml
outputs:
  - artifact: 'Brief/Campaign Map'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P03-DELIVERABLE-V1
    required: true
  - artifact: 'A/B concepts'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P03-DELIVERABLE-V1
    required: true
  - artifact: 'Definition of Ready'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P03-DELIVERABLE-V1
    required: true
work_product_state: DIRECTION_APPROVED
gates:
  - G13
  - G14
  - MW_BRIEF_APPROVED
next_workflow: P04
task_template_ref: task-template.yaml
prompt_spec_ref: prompt-spec.md
model:
  preferred: 'Modelo recomendado'
  alt: 'asistente general con buen manejo de contexto'
  avoid: 'generador multimedia como único decisor estratégico'
no_regression:
  - 'Checklist de no regresión'
dod:
  - 'Definition of Done'
fallback: 'Si la oportunidad no soporta una campaña, crea una pieza única con un derivado; si la evidencia es insuficiente, regresa a investigación. interpreta, planifica, ejecuta.'
brief:
  outputs:
    - 'Brief o campaña definidos con funciones distintas'
    - 'Conceptos A/B listos para decisión'
    - 'Definition of Ready cumplido'
  deliverables:
    - brief-campaign-map-v1
    - ab-concepts-v1
    - definition-of-ready-v1
  context: 'Define una pieza, sistema de derivados, serie o campaña con funciones distintas.'
  cta: 'Someter a MW_SPEC_APPROVED; avanzar a P04 calendarizar.'
capability_map:
  skills:
    - content-os-creative
    - content-os-product-launch-video
    - content-os-core
    - dev-writing-plans
  assets:
    - brief-campaign-map-v1
    - ab-concepts-v1
    - definition-of-ready-v1
execution_steps:
  - step_id: S01
    purpose: 'Interpretar intención, audiencia, objetivo y evidencia.'
    inputs: [intent-envelope, claim-register-v1, opportunity-map-v1]
    primary_skill: content-os-creative
    optional_skills: [dev-writing-plans]
    verifier: RT-09
    outputs: [brief-campaign-map-v1]
    template_id: TPL-P03-DELIVERABLE-V1
    gate: G13
    stop_rule: 'Formular como máximo tres preguntas; volver a P02 si falta evidencia.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
  - step_id: S02
    purpose: 'Elegir arquitectura de pieza, serie o campaña.'
    inputs: [brief-campaign-map-v1]
    primary_skill: dev-writing-plans
    optional_skills: [content-os-product-launch-video]
    verifier: RT-09
    outputs: [brief-campaign-map-v1]
    template_id: TPL-P03-DELIVERABLE-V1
    gate: G13
    stop_rule: 'Reducir a pieza única si la oportunidad no sostiene una campaña.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
  - step_id: S03
    purpose: 'Definir conceptos A/B, riesgos y criterios de éxito.'
    inputs: [brief-campaign-map-v1]
    primary_skill: content-os-creative
    optional_skills: [content-os-product-launch-video]
    verifier: RT-09
    outputs: [ab-concepts-v1]
    template_id: TPL-P03-DELIVERABLE-V1
    gate: G13
    stop_rule: 'Bloquear conceptos que alteren claims o excedan restricciones.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 9000, max_tokens: 15000}
  - step_id: S04
    purpose: 'Comprobar Definition of Ready y solicitar decisión.'
    inputs: [brief-campaign-map-v1, ab-concepts-v1]
    primary_skill: dev-writing-plans
    optional_skills: [content-os-core]
    verifier: RT-09
    outputs: [definition-of-ready-v1]
    template_id: TPL-P03-DELIVERABLE-V1
    gate: MW_BRIEF_APPROVED
    stop_rule: 'Detener antes de producir hasta recibir aprobación inequívoca del brief.'
    context_budget: {target_files: 10, max_files: 16, target_tokens: 10000, max_tokens: 16000}
metadata:
  source_id: MIA-MEDIA-LIB-2.0.0
  version: 2.0.0-candidato
  status: candidate
  locale:
