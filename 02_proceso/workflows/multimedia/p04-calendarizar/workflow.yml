schema_version: multimedia-workflow-v1
workflow_id: P04
command: /calendarizar
title: 'Construye un calendario editorial realista'
purpose: 'Ordena capacidad, dependencias y fechas desde investigación hasta aprendizaje.'
discipline: 'Operaciones de contenido'
phase: 'Operaciones'
tags:
  - operations
  - calendar
  - batching
modes:
  - id: sprint-semanal
    name: 'Sprint semanal'
    description: 'Sprint semanal'
  - id: calendario-de-30-dias
    name: 'Calendario de 30 días'
    description: 'Calendario de 30 días'
  - id: calendario-de-campana
    name: 'Calendario de campaña'
    description: 'Calendario de campaña'
  - id: sistema-evergreen-y-reactivo
    name: 'Sistema evergreen y reactivo'
    description: 'Sistema evergreen y reactivo'
inputs:
  - p03-crear-brief/workflow.yml
outputs:
  - deliverable_id: editorial-calendar-v1
    artifact: 'Cronograma editorial'
    schema_ref: 02_proceso/workflows/multimedia/_schema/artifacts/editorial-calendar-v1.schema.ts
    template_id: TPL-P04-DELIVERABLE-V1
    required: true
  - deliverable_id: content-grid-v1
    artifact: 'Parrilla de contenidos'
    schema_ref: 02_proceso/workflows/multimedia/_schema/artifacts/content-grid-v1.schema.ts
    template_id: TPL-P04-DELIVERABLE-V1
    required: false
    condition: 'content_count>1 or mode=calendario-de-campana'
  - deliverable_id: board-v1
    artifact: 'Tablero de producción'
    schema_ref: 02_proceso/workflows/multimedia/_schema/artifacts/board-v1.schema.ts
    template_id: TPL-P04-DELIVERABLE-V1
    required: true
  - deliverable_id: batch-plan-v1
    artifact: 'Plan por lotes'
    schema_ref: 02_proceso/workflows/multimedia/_schema/artifacts/batch-plan-v1.schema.ts
    template_id: TPL-P04-DELIVERABLE-V1
    required: true
work_product_state: DEFINED
gates:
  - G14
next_workflow: P05
task_template_ref: task-template.yaml
prompt_spec_ref: prompt-spec.md
model:
  preferred: 'Modelo recomendado'
  alt: 'asistente general con buen manejo de contexto'
  avoid: 'generador multimedia como único decisor estratégico'
no_regression:
  - 'Checklist de no regresión'
dod:
  - 'Definition of Done'
fallback: 'Si faltan briefs, crea un sprint mínimo con una pieza matriz y un derivado; si la capacidad es incierta, planifica la primera semana y mide antes de extender. interpreta, planifica, ejecuta.'
brief:
  outputs:
    - 'Calendario editorial realista con dependencias'
    - 'Tablero de capacidad por sprint'
    - 'Plan por lote medible antes de extender'
  deliverables:
    - editorial-calendar-v1
    - content-grid-v1
    - board-v1
    - batch-plan-v1
  context: 'Ordena capacidad, dependencias y fechas desde investigación hasta aprendizaje.'
  cta: 'Avanzar a P05 disenar-pieza con calendario aprobado.'
capability_map:
  skills:
    - dev-executing-plans
    - content-os-core
  assets:
    - editorial-calendar-v1
    - content-grid-v1
    - board-v1
    - batch-plan-v1
execution_steps:
  - step_id: S01
    purpose: 'Priorizar entregables y secuencia de producción.'
    inputs: [brief-campaign-map-v1, definition-of-ready-v1]
    primary_skill: dev-executing-plans
    optional_skills: [content-os-core]
    verifier: RT-11
    outputs: [editorial-calendar-v1, content-grid-v1]
    template_id: TPL-P04-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Omitir P04 para una pieza única sin dependencias ni calendario.'
    context_budget: {target_files: 6, max_files: 10, target_tokens: 6000, max_tokens: 10000}
  - step_id: S02
    purpose: 'Asignar hitos, dependencias y capacidad.'
    inputs: [editorial-calendar-v1]
    primary_skill: dev-executing-plans
    optional_skills: [content-os-core]
    verifier: RT-11
    outputs: [board-v1]
    template_id: TPL-P04-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Reducir al primer sprint si la capacidad no es verificable.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 7000, max_tokens: 12000}
  - step_id: S03
    purpose: 'Definir lotes y medición antes de extender.'
    inputs: [editorial-calendar-v1, board-v1]
    primary_skill: content-os-core
    optional_skills: [dev-executing-plans]
    verifier: RT-11
    outputs: [batch-plan-v1]
    template_id: TPL-P04-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Bloquear un lote que exceda capacidad o no tenga criterio de aprendizaje.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
metadata:
