<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <meta name="author" content="MetodologIA" />
    <meta name="application-name" content="Frames · MetodologIA" />
    <meta name="generator" content="Frames · MetodologIA" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#122562" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081433" />
    <meta name="frames:document-type" content="{{META_DOCUMENT_TYPE}}" />
    <meta name="frames:schema-version" content="{{META_SCHEMA_VERSION}}" />
    <meta name="frames:model-id" content="{{META_MODEL_ID}}" />
    <meta name="frames:workflow-id" content="{{META_WORKFLOW_ID}}" />
    <meta name="frames:content-sha256" content="{{CONTENT_HASH}}" />
    <meta name="frames:state" content="{{STATE}}" />
    <meta name="frames:next-gate" content="{{NEXT_GATE}}" />
    <meta name="frames:source-count" content="{{META_SOURCE_COUNT}}" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{TITLE}} · MetodologIA" />
    <meta property="og:description" content="{{META_DESCRIPTION}}" />
    <meta name="twitter:card" content="summary" />
    <title>{{TITLE}} · MetodologIA</title>
    <style>
      :root {
        --navy: #122562;
        --gold: #ffd700;
        --blue: #137dc5;
        --bg: #ffffff;
        --surface: #f0f4f8;
        --card: #ffffff;
        --text: #122562;
        --muted: #42526e;
        --border: #d9e2ec;
        --shadow: 0 12px 32px rgb(18 37 98 / 10%);
      }
      [data-theme='dark'] {
        --bg: #081433;
        --surface: #10234d;
        --card: #122562;
        --text: #ffffff;
        --muted: #d9e2ec;
        --border: #36558c;
        --shadow: 0 12px 32px rgb(0 0 0 / 28%);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family: 'Montserrat', 'Avenir Next', Arial, sans-serif;
        font-weight: 400;
        line-height: 1.65;
      }
      a,
      button {
        min-height: 44px;
        min-width: 44px;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      .skip-link {
        position: fixed;
        z-index: 10;
        left: 1rem;
        top: -6rem;
        padding: 0.75rem 1rem;
        color: #ffffff;
        background: var(--blue);
        border-radius: 999px;
      }
      .skip-link:focus {
        top: 1rem;
      }
      header {
        padding: clamp(2.5rem, 7vw, 6rem) clamp(1.25rem, 6vw, 6rem);
        color: #ffffff;
        background: var(--navy);
      }
      .eyebrow,
      .note {
        font-family: 'Trebuchet MS', sans-serif;
        letter-spacing: 0.08em;
      }
      .eyebrow {
        color: var(--gold);
        text-transform: uppercase;
        font-weight: 700;
      }
      h1,
      h2,
      h3 {
        margin-top: 0;
        font-family: 'Poppins', 'Avenir Next', Arial, sans-serif;
        font-weight: 700;
        line-height: 1.15;
      }
      h1 {
        max-width: 18ch;
        margin-bottom: 1rem;
        font-size: clamp(2.25rem, 7vw, 5.5rem);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0.55rem 1rem;
        border: 1px solid rgb(255 255 255 / 45%);
        border-radius: 999px;
      }
      #theme-toggle {
        margin-top: 1.5rem;
        padding: 0.6rem 1rem;
        color: var(--navy);
        background: var(--gold);
        border: 0;
        border-radius: 999px;
        font:
          700 1rem 'Montserrat',
          sans-serif;
        cursor: pointer;
      }
      main {
        width: min(1120px, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: 3rem 0 5rem;
      }
      .toc {
        width: min(1120px, calc(100% - 2.5rem));
        margin: -1.5rem auto 2rem;
        padding: 1.25rem;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .toc strong {
        display: block;
        margin-bottom: 0.75rem;
        font-family: 'Poppins', 'Avenir Next', Arial, sans-serif;
      }
      .toc ol {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.35rem 1.5rem;
        margin: 0;
        padding-left: 1.5rem;
      }
      .toc a {
        display: inline-flex;
        align-items: center;
        color: var(--blue);
        font-weight: 700;
        text-underline-offset: 0.2em;
      }
      .governance-strip {
        padding: 0.8rem 1.25rem;
        color: #ffffff;
        background: var(--blue);
        text-align: center;
        font-family: 'Trebuchet MS', sans-serif;
        font-weight: 700;
      }
      section {
        position: relative;
        margin: 0 0 1.25rem;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }
      section h2 {
        padding-left: 1rem;
        border-left: 6px solid var(--gold);
        font-size: clamp(1.35rem, 3vw, 2rem);
      }
      .step-index {
        position: absolute;
        right: 1.25rem;
        top: 1rem;
        color: var(--blue);
        font:
          700 0.85rem 'Trebuchet MS',
          sans-serif;
      }
      .section-body {
        color: var(--muted);
      }
      .section-body strong,
      .section-body h3 {
        color: var(--text);
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      code {
        padding: 0.15rem 0.35rem;
        background: var(--surface);
        border-radius: 6px;
      }
      pre {
        overflow: auto;
        padding: 1rem;
        background: var(--surface);
        border-radius: 16px;
      }
      .brief-diagram {
        width: 100%;
        height: auto;
        color: var(--navy);
      }
      .brief-diagram rect {
        fill: var(--surface);
        stroke: var(--blue);
        stroke-width: 2;
      }
      .brief-diagram line {
        stroke: var(--blue);
        stroke-width: 2;
      }
      .brief-diagram path {
        fill: var(--blue);
      }
      .brief-diagram text {
        fill: var(--text);
        font:
          700 14px 'Montserrat',
          sans-serif;
      }
      footer {
        padding: 2rem 1.25rem;
        color: var(--muted);
        background: var(--surface);
        text-align: center;
      }
      @media (min-width: 768px) {
        main {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1.25rem;
        }
        section {
          margin: 0;
        }
        section:nth-child(1),
        section:nth-child(11),
        section:nth-child(12) {
          grid-column: 1 / -1;
        }
      }
      @media (min-width: 1280px) {
        header {
          padding-inline: max(6rem, calc((100vw - 1120px) / 2));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      @media print {
        :root {
          --bg: #ffffff;
          --card: #ffffff;
          --text: #122562;
          --muted: #263b66;
        }
        #theme-toggle,
        .skip-link,
        .toc {
          display: none;
        }
        header {
          padding: 1rem 0;
          color: var(--navy);
          background: #ffffff;
        }
        .eyebrow {
          color: var(--navy);
        }
        main {
          display: block;
          width: 100%;
          padding: 0;
        }
        section {
          break-inside: avoid;
          margin-bottom: 0.75rem;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#{{CONTENT_ID}}">{{SKIP_LABEL}}</a>
    <header>
      <div class="eyebrow">{{KICKER}}</div>
      <h1>{{TITLE}}</h1>
      <div class="meta">
        <span class="pill">{{DOCUMENT_ID}}</span>
        <span class="pill">Estado: {{STATE}}</span>
        <span class="pill">Gate: {{NEXT_GATE}}</span>
      </div>
      <button id="theme-toggle" type="button" aria-pressed="false">Cambiar tema</button>
    </header>
    <div class="governance-strip" role="note">
      RENDERED_DRAFT ≠ HUMAN_APPROVED ≠ READY ≠ PUBLISHED
    </div>
    {{TOC}}
    <main id="{{CONTENT_ID}}" data-content-sha256="{{CONTENT_HASH}}">{{SECTIONS}}</main>
    <script id="{{CANONICAL_DATA_ID}}" type="application/json">
      {{CANONICAL_JSON}}
    </script>
    <footer class="note">{{PROJECTION_LABEL}} · {{CONTENT_HASH}}</footer>
    <script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector('#theme-toggle');
        let stored = null;
        try {
          stored = localStorage.getItem('metodologia-theme');
        } catch {}
        if (stored === 'dark') root.dataset.theme = 'dark';
        button?.setAttribute('aria-pressed', String(root.dataset.theme === 'dark'));
        button?.addEventListener('click', () => {
          const dark = root.dataset.theme !== 'dark';
          root.dataset.theme = dark ? 'dark' : 'light';
          button.setAttribute('aria-pressed', String(dark));
          try {
            localStorage.setItem('metodologia-theme', root.dataset.theme);
          } catch {}
        });
      })();
    </script>
  </body>
</html>
