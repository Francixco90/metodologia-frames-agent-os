    - instagram-carousel-production
  assets:
    - platform-package-v1
    - publication-record-v1
    - learning-report-v1
execution_steps:
  - step_id: S01
    purpose: 'Validar autorización, estado y hash del candidate.'
    inputs: [edit-candidate-v1, export-matrix-v1]
    primary_skill: metodologia-brand-router
    optional_skills: [instagram-content-orchestration]
    verifier: RT-11
    outputs: [platform-package-v1]
    template_id: TPL-P09-DELIVERABLE-V1
    gate: MW_DISTRIBUTION_AUTHORIZED
    stop_rule: 'Sin aprobación humana inequívoca, preparar package y detener.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
  - step_id: S02
    purpose: 'Adaptar el paquete al canal sin mutar el contenido aprobado.'
    inputs: [platform-package-v1]
    primary_skill: instagram-content-orchestration
    optional_skills: [instagram-carousel-production]
    verifier: RT-11
    outputs: [platform-package-v1]
    template_id: TPL-P09-DELIVERABLE-V1
    gate: G15
    stop_rule: 'Bloquear adaptación que altere claims, marca o autorización.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 9000, max_tokens: 15000}
  - step_id: S03
    purpose: 'Preparar checklist y registro de publicación.'
    inputs: [platform-package-v1]
    primary_skill: instagram-carousel-production
    optional_skills: [instagram-content-orchestration]
    verifier: RT-11
    outputs: [publication-record-v1]
    template_id: TPL-P09-DELIVERABLE-V1
    gate: G17
    stop_rule: 'No publicar, enviar ni activar conectores desde este workflow.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
  - step_id: S04
    purpose: 'Registrar baseline y aprendizaje sin inventar métricas.'
    inputs: [publication-record-v1, observed-results]
    primary_skill: instagram-content-orchestration
    optional_skills: [metodologia-brand-router]
    verifier: RT-11
    outputs: [learning-report-v1]
    template_id: TPL-P09-DELIVERABLE-V1
    gate: G17
    stop_rule: 'Marcar coverage_gap si no existen datos observables.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 8000, max_tokens: 14000}
