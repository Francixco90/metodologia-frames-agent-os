brief:
  outputs:
    - 'Paquete de activos generado por etapas con estado exacto'
    - 'Manifiesto de activos trazable'
    - 'Reporte de capacidad y evidencia de herramienta'
  deliverables:
    - asset-package-v1
    - asset-manifest-v1
    - capability-report-v1
    - tool-run-evidence-v1
