schema_version: multimedia-workflow-v1
workflow_id: P01
command: /curar-material
title: 'Convierte tu día a día en oportunidades de contenido'
purpose: 'Convierte material cotidiano en oportunidades trazables sin obligar a publicarlo.'
discipline: 'Edición documental'
phase: 'Documentación'
tags:
  - documentary
  - curation
  - capture
modes:
  - id: captura-registrar-una-entrada
    name: 'Captura: registrar una entrada'
    description: 'Captura: registrar una entrada'
  - id: triage-decidir-su-destino
    name: 'Triage: decidir su destino'
    description: 'Triage: decidir su destino'
  - id: digest-curar-un-lote
    name: 'Digest: curar un lote'
    description: 'Digest: curar un lote'
  - id: recuperacion-encontrar-material-previo-p
    name: 'Recuperación: encontrar material previo pertinente'
    description: 'Recuperación: encontrar material previo pertinente'
inputs:
  - p00-definir-sistema/workflow.yml
outputs:
  - artifact: 'Capture Card'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P01-DELIVERABLE-V1
    required: true
  - artifact: 'Triage Record'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P01-DELIVERABLE-V1
    required: true
  - artifact: 'Digest/Shortlist'
    schema_ref: _assets/artifact-registry.md
    template_id: TPL-P01-DELIVERABLE-V1
    required: true
work_product_state: CLASSIFIED
gates:
  - G14
next_workflow: P02
task_template_ref: task-template.yaml
prompt_spec_ref: prompt-spec.md
model:
  preferred: 'Modelo recomendado'
  alt: 'asistente general con buen manejo de contexto'
  avoid: 'generador multimedia como único decisor estratégico'
no_regression:
  - 'Checklist de no regresión'
dod:
  - 'Definition of Done'
fallback: 'Cuando el material sea insuficiente, acumúlalo y propone la captura mínima que permitiría evaluarlo; cuando exista riesgo, protege antes de producir. interpreta, planifica, ejecuta.'
brief:
  outputs:
    - 'Material cotidiano clasificado en oportunidades trazables'
    - 'Captura mínima propuesta sin obligar a publicar'
    - 'Shortlist digerible priorizada'
  deliverables:
    - capture-card-v1
    - triage-record-v1
    - digest-shortlist-v1
  context: 'Convierte material cotidiano en oportunidades trazables sin obligar a publicarlo.'
  cta: 'Avanzar a P02 investigar con shortlist clasificado.'
capability_map:
  skills:
    - content-os-registry
    - content-os-media
    - metodologia-find-skills
  assets:
    - capture-card-v1
    - triage-record-v1
    - digest-shortlist-v1
execution_steps:
  - step_id: S01
    purpose: 'Inventariar y preservar material con procedencia.'
    inputs: [brand-os-v1, source-items]
    primary_skill: content-os-registry
    optional_skills: [content-os-media]
    verifier: RT-09
    outputs: [capture-card-v1]
    template_id: TPL-P01-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Bloquear si faltan fuente, hash o autoridad.'
    context_budget: {target_files: 6, max_files: 12, target_tokens: 6000, max_tokens: 10000}
  - step_id: S02
    purpose: 'Clasificar relevancia, sensibilidad, derechos y destino.'
    inputs: [capture-card-v1]
    primary_skill: content-os-media
    optional_skills: [content-os-registry]
    verifier: RT-09
    outputs: [triage-record-v1]
    template_id: TPL-P01-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Bloquear material sensible o sin derechos verificables.'
    context_budget: {target_files: 8, max_files: 14, target_tokens: 7000, max_tokens: 12000}
  - step_id: S03
    purpose: 'Seleccionar y priorizar el material utilizable.'
    inputs: [triage-record-v1]
    primary_skill: metodologia-find-skills
    optional_skills: [content-os-registry]
    verifier: RT-09
    outputs: [digest-shortlist-v1]
    template_id: TPL-P01-DELIVERABLE-V1
    gate: G14
    stop_rule: 'Detener si ningún elemento supera el preclear de evidencia y derechos.'
    context_budget: {target_files: 8, max_files: 16, target_tokens: 8000, max_tokens: 14000}
metadata:
  source_id: MIA-MEDIA-LIB-2.0.0
  version: 2.0.0-candidato
  status: candidate
  locale:
    - es
    - en
    - pt
