schema_version: brand-tokens-v2
token_set_id: metodologia-social-light-v2
brand_id: metodologia
authored: true
default_theme: light
source_binding:
  bundle_ref: registries/brand/source-bundle-v1.yml
  source_id: BRAND-SRC-TOKENS
  source_sha256: 32cc6576323aae325160c589cac500f6965b897070aecbc048278c363ed25f19
colors:
  canvas: '#f5f7fa'
  canvas_deep: '#e2e8f0'
  ink: '#0a122a'
  surface: '#ffffff'
  surface_alt: '#f1f5f9'
  gold_fill: '#e0b400'
  gold_text: '#8a6d00'
  gold_soft: '#f0c820'
  text_soft: '#334155'
  muted: '#576472'
  border: 'rgba(10, 18, 42, .12)'
  border_hover: 'rgba(224, 180, 0, .45)'
semantic:
  text_primary: ink
  text_on_gold: ink
  accent_fill: gold_fill
  accent_text: gold_text
  panel: surface
  panel_alternate: surface_alt
css_aliases:
  brand_navy: ink
  brand_white: surface
  brand_white_soft: surface_alt
  brand_white_muted: canvas_deep
typography:
  heading:
    family: Poppins
    fallback: 'system-ui, sans-serif'
    allowed_weights: [600, 700, 800, 900]
  body:
    family: Montserrat
    fallback: 'system-ui, sans-serif'
    allowed_weights: [400, 500, 600, 700]
layout:
  radius: 16px
  radius_large: 24px
  gutter: 'clamp(1rem, 3vw, 2rem)'
motion:
  standard: 'cubic-bezier(.4, 0, .2, 1)'
  spring: 'cubic-bezier(.34, 1.56, .64, 1)'
  out_expo: 'cubic-bezier(.16, 1, .3, 1)'
accessibility:
  body_text_minimum_contrast: 4.5
  large_text_and_ui_minimum_contrast: 3
  gold_pairing_rule: text_on_gold
  forbidden_pairing: white_on_gold
career:
  schema_version: metodologia-career-palette-v1
  default_theme: navy
  print_theme: light
  navy:
    canvas: '#062f62'
    surface: '#093d78'
    surface_raised: '#0d4788'
    text: '#f4f7fb'
    text_muted: '#b9c9dc'
    accent: '#f0c541'
    accent_text: '#17150c'
    line: '#52749b'
    focus: '#ffdb63'
    shadow: 'rgba(1, 13, 30, .34)'
    backdrop: 'rgba(2, 11, 24, .74)'
  light:
    canvas: '#f3f4f2'
    surface: '#fafaf7'
    surface_raised: '#e8e9e6'
    text: '#171a1e'
    text_muted: '#505963'
    accent: '#765400'
    accent_text: '#fafaf7'
    line: '#a8adb1'
    focus: '#765400'
    shadow: 'rgba(30, 34, 38, .13)'
    backdrop: 'rgba(23, 26, 30, .58)'
projection_targets:
  - brand/generated/social-light.tokens.json
  - brand/generated/social-light.css
  - brand/generated/social-light.tokens.ts
