case: animate-presence-exit
context: Modal React necesita animación de entrada y salida al montar/desmontar.
request: 'Anima un modal con entrada y salida suave usando Framer Motion en React.'
expect: >
  Salida usa AnimatePresence mode="wait" envolviendo conditional render, motion.div con key único,
