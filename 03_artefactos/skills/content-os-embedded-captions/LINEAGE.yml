  adaptation_notes: >
    Orquestador footage→captioned-video: añade captions a talking-head existente
    sin editar el footage. Caption model rail (default) + embed (pico escaso) +
    drop (filler). Transcription via content-os-media (whisper.cpp offline
    default; WhisperX remote opt-in auth-gated). Matting via content-os-media
    (ffmpeg bg-removal local default; remote opt-in auth-gated). Composition via
    content-os-core (HTML+GSAP seekable → frames → FFmpeg composite). Identity
    catalog (DNA registry + themes). Modes standard/cinematic/theme. Footage
    untouched (never grade). Rail-first. Output RENDERED_DRAFT, no HUMAN_APPROVED.
