  adaptation_notes: >
    Orquestador deck→navigable-slideshow: autor una presentación o deck
    interactivo con slides discretos, fragment reveals, branching hotspots,
    presenter mode con speaker notes. También convierte una página existente en
    deck. Output es el deck HTML (navegable), NO MP4 (sin master-root
    composition; render truncaría al primer slide). Composition via content-os-core
    (HTML+GSAP seekable per slide). Lint via content-os-keyframes. Slide blocks
    via content-os-registry. Brand tokens via content-os-creative. Unnarrated
    (speaker notes presenter-only, no TTS). Slide writing rules (headline =
    complete-sentence claim, no label). JSON island declares slides + sequences.
    Output RENDERED_DRAFT (deck draft), no HUMAN_APPROVED.
