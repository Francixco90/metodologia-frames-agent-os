# Negative fixture: documents all 6 violation codes.
# - missing-gate: build state done (invalid)
# - step-out-of-order: design before plan
# - no-deck: finalize gate-passed + deck_presentable false
# - network-in-workflow: offline false + https URL in source_page
# - render-mp4: rendered_mp4 true (deck has no master-root; render truncates)
# - label-not-claim: headline_label true (headline must be a claim, not a label)
schemaVersion: slideshow-v1
projectId: bad-deck
route: content-os-slideshow
vo_mode: silent
has_script: false
footage: false
offline: false # network-in-workflow: offline not true
output_format: deck
rendered_mp4: true # render-mp4: deck has no master-root; render truncates to first slide
headline_label: true # label-not-claim: headline must be a complete-sentence claim
deck_presentable: false # no-deck: finalize gate-passed without presentable deck
source_page: https://acme.com/launch # network-in-workflow: https URL in state
capability_map:
  - content-os-core
  - content-os-creative
steps:
  - step: setup
    state: gate-passed
  - step: design
    state: gate-passed # step-out-of-order: design before plan
  - step: plan
    state: gate-passed
  - step: build
    state: done # missing-gate: build state done (invalid, not in VALID_STATES)
  - step: verify
    state: gate-passed
  - step: finalize
    state: gate-passed # no-deck: finalize gate-passed + deck_presentable false
