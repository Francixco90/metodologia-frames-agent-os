:root{--ink:#152238;--canvas:#ffffff;--accent:#334155;--brand-night:#152238;--dark-accent:#e2e8f0;--dark-surface:#152238}</style><body><a class="skip" href="#main">Saltar al contenido</a><header><strong id="brand"></strong><select id="language" aria-label="Idioma"></select><button id="motion">Pausar animación</button><button id="projection">Proyectar</button><button onclick="window.print()">Imprimir</button></header><main id="main" tabindex="-1"></main><nav aria-label="Secciones"><button id="prev">Anterior</button><span id="position" aria-live="polite"></span><button id="next">Siguiente</button></nav><footer>RENDERED_DRAFT · Revisión humana pendiente</footer><script type="application/json" id="payload">{"data": {"schemaVersion": "frames-aula-v1", "title": "Presentaciones de Alto Impacto · Workshop inmersivo", "language": "es", "languages": ["es"], "theme": "dark", "objectives": ["Preparar un brief que vincule audiencia, decisión y restricción.", "Construir y revisar un relato de cuatro títulos y una relación visual.", "Definir una próxima prueba con un criterio observable."], "acceptance": ["El artefacto contiene brief, cuatro títulos, boceto y pregunta pendiente.", "La revisión muestra una edición motivada por un criterio del taller.", "La ficha de transferencia describe una acción y cómo se revisará."], "authoringPolicy": {"origin": "new", "maxSlides": 20, "explicitBrief": "Golden workshop autorizado de veinte slides basado funcionalmente en referencia histórica de veinte escenas"}, "training": {"durationMinutes": 60, "audience": "Personas que preparan presentaciones y facilitan decisiones en equipos.", "materials": ["Editor de texto o papel y lápiz.", "Caso ficticio incluido: equipo que elige un registro de solicitudes.", "El HTML local y su versión sin notas; modelo externo opcional."], "runOfShow": [{"sectionId": "apertura", "minutes": 1, "notes": "Explica el producto final: un brief, cuatro títulos, una escena y una revisión. Aclara que el taller no acredita resultados de aprendizaje medidos. Conserva el avance manual."}, {"sectionId": "acuerdo", "minutes": 2, "notes": "Pide un ejemplo breve de decisión pendiente. No recopiles nombres, clientes ni información privada. Si la persona no trae un caso, ofrece el escenario ficticio del taller."}, {"sectionId": "observacion", "minutes": 2, "notes": "Lee primero el ejemplo débil. Pide identificar qué información falta sin juzgar al autor. Recoge una respuesta y úsala como puente hacia el brief."}, {"sectionId": "decision", "minutes": 2, "notes": "Distingue la decisión de una promesa de eficiencia. No inventes porcentajes ni ahorros. Señala que elegir un registro exige revisar restricciones del equipo."}, {"sectionId": "audiencia", "minutes": 2, "notes": "Invita a responder desde un rol, sin nombres propios. Acepta «no sabemos» y conviértelo en una pregunta del brief. No supongas necesidades de una persona real."}, {"sectionId": "evidencia", "minutes": 2, "notes": "Presenta las tres categorías como regla editorial del taller. Si aparece una cifra real sin fuente, retírala del relato y anótala para verificarla fuera de la sesión."}, {"sectionId": "pregunta", "minutes": 2, "notes": "Pide una pregunta que afecte la elección del registro. Si recibe una pregunta demasiado amplia, solicita identificar la decisión que ayudaría a tomar."}, {"sectionId": "estructura", "minutes": 2, "notes": "Muestra cómo cada movimiento prepara el siguiente. Permite otra secuencia cuando el participante explique su función y mantenga la decisión comprensible."}, {"sectionId": "titulos", "minutes": 2, "notes": "Lee un título temático y uno propositivo del caso. No conviertas una recomendación de longitud en una afirmación científica. Revisa el sentido antes de reducir palabras."}, {"sectionId": "escena", "minutes": 2, "notes": "Dibuja cuatro cajas y sus relaciones en papel. Explica que las escenas no son gráficos de cantidades. Mantén disponibles título y explicación en la versión estática."}, {"sectionId": "criterios", "minutes": 2, "notes": "Señala una señal observable de cada criterio. Explica que cumplir esta lista permite revisar un borrador, pero no constituye aprobación humana ni publicación."}, {"sectionId": "demo-brief", "minutes": 5, "notes": "Comparte el brief y verbaliza por qué incluye cada dato. Pide una objeción concreta antes de continuar. Plan B sin red ni modelo: escribe en una hoja audiencia, decisión, restricción y pregunta pendiente."}, {"sectionId": "demo-relato", "minutes": 4, "notes": "Revela primero el borrador y después la revisión. Explica el criterio que motivó el cambio. Plan B manual: lee ambas versiones impresas y dibuja la escena en una hoja."}, {"sectionId": "consigna", "minutes": 2, "notes": "Demuestra la edición de un campo y la copia exacta del texto resultante. Indica que el prompt guía un borrador: su salida requiere revisión. Ofrece la misma consigna impresa cuando no haya tecnología."}, {"sectionId": "practica-individual", "minutes": 15, "notes": "Inicia el timebox sólo cuando las instrucciones estén claras. Pausa si el grupo necesita una aclaración. Ofrece el caso ficticio y la ficha de papel; ayuda con la decisión antes de ayudar con el diseño."}, {"sectionId": "revision-pares", "minutes": 4, "notes": "Inicia el timebox al formar parejas. Da dos minutos por rol y permite pausar. Quien escucha primero reformula la decisión; después formula una pregunta. Si alguien trabaja solo, usa la ficha del ejemplo como contraste."}, {"sectionId": "revision-propia", "minutes": 3, "notes": "Pide un cambio concreto y su motivo. No exijas rehacer todo el borrador. Mantén juntas ambas versiones para que el participante pueda mostrar qué revisó."}, {"sectionId": "debrief", "minutes": 2, "notes": "Recoge dos respuestas breves. Pide un ejemplo del borrador para cada observación. Si alguien promete ahorrar tiempo o mejorar resultados, solicita mantenerlo como expectativa pendiente de medición."}, {"sectionId": "transferencia", "minutes": 2, "notes": "Pide una situación, una acción y una fecha de revisión sin registrar nombres ni información privada. Acepta «fecha por acordar» como decisión de seguimiento, no como placeholder del artefacto."}, {"sectionId": "cierre", "minutes": 2, "notes": "Cierra recordando los productos, la próxima prueba y el gate humano. Ofrece el ejemplo neutral y las instrucciones offline como respaldo. No distribuyas ni publiques piezas de participantes sin autorización."}]}, "sections": [{"id": "apertura", "title": "Presenta para lograr una decisión", "durationMinutes": 1, "body": "Taller de Presentaciones de Alto Impacto. Construye un relato breve para una decisión concreta. Los tiempos y la organización de esta sesión son propuestas de diseño. [SUPUESTO]", "scene": "learning-opening", "sceneParams": {"title": "Presenta para lograr una decisión", "a": "Audiencia", "b": "Decisión", "c": "Relato", "d": "Revisión"}, "facilitatorNotes": "Explica el producto final: un brief, cuatro títulos, una escena y una revisión. Aclara que el taller no acredita resultados de aprendizaje medidos. Conserva el avance manual.", "objectives": ["Preparar un relato y revisar si orienta una decisión."], "acceptance": ["Identifica audiencia, decisión y producto final."]}, {"id": "acuerdo", "title": "Define qué llevarás al salir", "durationMinutes": 2, "body": "Al cierre tendrás un brief, cuatro títulos conectados y un boceto que otra persona pueda revisar. El ejercicio usa un equipo ficticio y no requiere datos personales. [METODOLOGIA]", "scene": "steps", "sceneParams": {"title": "Define qué llevarás al salir", "a": "Brief", "b": "Títulos", "c": "Boceto", "d": "Revisión"}, "facilitatorNotes": "Pide un ejemplo breve de decisión pendiente. No recopiles nombres, clientes ni información privada. Si la persona no trae un caso, ofrece el escenario ficticio del taller.", "table": {"headers": ["Producto", "Criterio observable"], "rows": [["Brief", "Nombra audiencia, decisión y restricción."], ["Relato", "Cada título aporta un paso de la decisión."], ["Boceto", "Sus relaciones visuales coinciden con el título."]], "caption": "Contrato de revisión del ejercicio; no es una escala de aprendizaje."}}, {"id": "observacion", "title": "Detecta una presentación sin propósito", "durationMinutes": 2, "body": "Ejemplo ficticio: un equipo debe elegir cómo registrar solicitudes. Una apertura dedicada a describir herramientas deja la decisión sin explicar. [SUPUESTO]", "scene": "evidence-observe", "sceneParams": {"title": "Detecta una presentación sin propósito", "a": "Herramientas", "b": "Lista", "c": "Audiencia", "d": "Decisión"}, "facilitatorNotes": "Lee primero el ejemplo débil. Pide identificar qué información falta sin juzgar al autor. Recoge una respuesta y úsala como puente hacia el brief.", "exemplar": "Apertura débil: «Tenemos varias aplicaciones». Falta explicar quién decide qué y con qué criterio. [SUPUESTO]", "reflection": "¿Qué pregunta necesitarías responder antes de diseñar la primera diapositiva?", "checkpoints": [{"question": "¿Qué falta en esta apertura?", "answer": "La audiencia, la decisión y el criterio para elegir.", "criterion": "Señala una ausencia concreta del ejemplo."}]}, {"id": "decision", "title": "Escribe la decisión antes del diseño", "durationMinutes": 2, "body": "Caso ficticio: coordinación debe elegir un único registro para las solicitudes del equipo. El criterio de trabajo será poder ver responsable y estado sin consultar varios lugares. [SUPUESTO]", "scene": "decision-options", "sceneParams": {"title": "Escribe la decisión antes del diseño", "a": "Situación", "b": "Opciones", "c": "Criterio", "d": "Decisión"}, "facilitatorNotes": "Distingue la decisión de una promesa de eficiencia. No inventes porcentajes ni ahorros. Señala que elegir un registro exige revisar restricciones del equipo.", "exemplar": "Decisión: elegir un registro común. Criterio: cada solicitud muestra responsable y estado. Restricción: usar las herramientas ya disponibles. [SUPUESTO]", "acceptance": ["El enunciado propone una decisión revisable y una restricción."]}, {"id": "audiencia", "title": "Ajusta el relato a quien decide", "durationMinutes": 2, "body": "Una audiencia necesita contexto suficiente, una elección clara y la evidencia disponible. Pregunta qué sabe, qué puede decidir y qué objeción deberá revisar. [METODOLOGIA]", "scene": "team-roles", "sceneParams": {"title": "Ajusta el relato a quien decide", "a": "Lo que sabe", "b": "Lo que decide", "c": "Lo que pregunta", "d": "Lo que revisa"}, "facilitatorNotes": "Invita a responder desde un rol, sin nombres propios. Acepta «no sabemos» y conviértelo en una pregunta del brief. No supongas necesidades de una persona real.", "cards": [{"title": "Contexto", "body": "¿Qué conoce ya la audiencia?", "icon": "communication-listening"}, {"title": "Decisión", "body": "¿Qué elección puede tomar?", "icon": "assessment-criterion"}, {"title": "Restricción", "body": "¿Qué condición limita la propuesta?", "icon": "facilitation-framing"}]}, {"id": "evidencia", "title": "Distingue observación, supuesto y pregunta", "durationMinutes": 2, "body": "Una afirmación necesita procedencia. Un supuesto conserva su etiqueta. Una ausencia se convierte en pregunta. En este caso ficticio no contamos con métricas reales. [METODOLOGIA]", "scene": "evidence-observe", "sceneParams": {"title": "Distingue observación, supuesto y pregunta", "a": "Observación", "b": "Procedencia", "c": "Supuesto", "d": "Pregunta"}, "facilitatorNotes": "Presenta las tres categorías como regla editorial del taller. Si aparece una cifra real sin fuente, retírala del relato y anótala para verificarla fuera de la sesión.", "table": {"headers": ["Tipo", "Ejemplo del caso ficticio"], "rows": [["Observación simulada", "El ejemplo muestra registros en lugares distintos."], ["Supuesto", "Un registro común podría facilitar la revisión."], ["Pregunta", "¿Qué restricciones debe cumplir el registro?"]], "caption": "Ejemplos de práctica; no describen una organización real. [SUPUESTO]"}, "acceptance": ["Ninguna afirmación inventada se presenta como un hecho real."]}, {"id": "pregunta", "title": "Convierte el vacío en una pregunta útil", "durationMinutes": 2, "body": "Pregunta por el dato que podría cambiar la decisión. Evita llenar una ausencia con una cifra o una conclusión inventada. [METODOLOGIA]", "scene": "learning-recall", "sceneParams": {"title": "Convierte el vacío en una pregunta útil", "a": "Ausencia", "b": "Pregunta", "c": "Respuesta", "d": "Cambio"}, "facilitatorNotes": "Pide una pregunta que afecte la elección del registro. Si recibe una pregunta demasiado amplia, solicita identificar la decisión que ayudaría a tomar.", "reflection": "¿Qué respuesta te haría cambiar la opción propuesta?", "checkpoints": [{"question": "¿Qué pregunta falta en el caso?", "answer": "Por ejemplo: ¿quién mantiene el registro y qué acceso necesita cada rol?", "criterion": "Vincula la respuesta esperada con una decisión del brief."}]}, {"id": "estructura", "title": "Ordena el relato por cambios de comprensión", "durationMinutes": 2, "body": "Propón cuatro movimientos: situación, tensión, opción y siguiente paso. Esta secuencia es una herramienta de diseño del taller, no una regla universal. [SUPUESTO]", "scene": "flow", "sceneParams": {"title": "Ordena el relato por cambios de comprensión", "a": "Situación", "b": "Tensión", "c": "Opción", "d": "Siguiente paso"}, "facilitatorNotes": "Muestra cómo cada movimiento prepara el siguiente. Permite otra secuencia cuando el participante explique su función y mantenga la decisión comprensible.", "cols": [{"title": "Inicio", "body": "Ubica a la audiencia ante una situación concreta."}, {"title": "Desarrollo", "body": "Explica qué necesita resolver y qué opción puede revisar."}, {"title": "Cierre", "body": "Propone una acción y su criterio de revisión."}]}, {"id": "titulos", "title": "Haz que los títulos expresen avances", "durationMinutes": 2, "body": "Escribe títulos que expliquen qué cambia entre una diapositiva y otra. Usa frases que la audiencia pueda relacionar con la decisión. [METODOLOGIA]", "scene": "steps", "sceneParams": {"title": "Haz que los títulos expresen avances", "a": "Qué ocurre", "b": "Qué falta", "c": "Qué propones", "d": "Qué sigue"}, "facilitatorNotes": "Lee un título temático y uno propositivo del caso. No conviertas una recomendación de longitud en una afirmación científica. Revisa el sentido antes de reducir palabras.", "exemplar": "Tema: «Organización». Propuesta: «Un registro permite revisar responsable y estado». El ejemplo es una hipótesis de diseño, pendiente de prueba. [SUPUESTO]", "acceptance": ["Cada título aporta una idea distinta y evita cifras sin procedencia."]}, {"id": "escena", "title": "Dibuja la relación que quieres explicar", "durationMinutes": 2, "body": "Elige una composición que represente una relación: comparación, secuencia o decisión. Conserva las etiquetas legibles y el sentido completo al pausar el movimiento. [METODOLOGIA]", "scene": "learning-demonstration", "sceneParams": {"title": "Dibuja la relación que quieres explicar", "a": "Entrada", "b": "Responsable", "c": "Estado", "d": "Revisión"}, "facilitatorNotes": "Dibuja cuatro cajas y sus relaciones en papel. Explica que las escenas no son gráficos de cantidades. Mantén disponibles título y explicación en la versión estática.", "demonstration": "Traza una solicitud que entra, recibe responsable, cambia de estado y llega a revisión. El esquema muestra una propuesta ficticia, no resultados de ejecución. [SUPUESTO]", "acceptance": ["La escena representa la idea del título sin depender de animación."]}, {"id": "criterios", "title": "Revisa el artefacto con señales observables", "durationMinutes": 2, "body": "Comprueba propósito, procedencia, continuidad y legibilidad. La revisión identifica qué editar en el artefacto; no asigna puntuaciones a las personas. [METODOLOGIA]", "scene": "gate", "sceneParams": {"title": "Revisa el artefacto con señales observables", "a": "Propósito", "b": "Procedencia", "c": "Continuidad", "d": "Legibilidad"}, "facilitatorNotes": "Señala una señal observable de cada criterio. Explica que cumplir esta lista permite revisar un borrador, pero no constituye aprobación humana ni publicación.", "cards": [{"title": "Propósito", "body": "La decisión está escrita.", "icon": "assessment-criterion"}, {"title": "Procedencia", "body": "Los hechos llevan fuente; los supuestos conservan etiqueta.", "icon": "evidence-provenance"}, {"title": "Lectura", "body": "El título y la escena se entienden juntos.", "icon": "design-composition"}]}, {"id": "demo-brief", "title": "Construye el brief frente al grupo", "durationMinutes": 5, "body": "Demostración con el caso ficticio: audiencia de coordinación, decisión sobre el registro y restricción de usar herramientas disponibles. El facilitador narra cada elección. [SUPUESTO]", "scene": "learning-demonstration", "sceneParams": {"title": "Construye el brief frente al grupo", "a": "Audiencia", "b": "Decisión", "c": "Restricción", "d": "Pregunta"}, "facilitatorNotes": "Comparte el brief y verbaliza por qué incluye cada dato. Pide una objeción concreta antes de continuar. Plan B sin red ni modelo: escribe en una hoja audiencia, decisión, restricción y pregunta pendiente.", "demonstration": "Completa el brief con el grupo. Luego identifica un dato que falta y conserva la pregunta. Si no hay red, trabaja con la hoja y el caso ficticio; ninguna etapa exige un modelo externo.", "exemplar": "Audiencia: coordinación. Decisión: elegir un registro común. Restricción: herramientas existentes. Pregunta: quién mantendrá los estados. [SUPUESTO]", "acceptance": ["El brief identifica audiencia, decisión, restricción y una pregunta pendiente."]}, {"id": "demo-relato", "title": "Muestra cómo una revisión cambia el relato", "durationMinutes": 4, "body": "A partir del brief, prepara cuatro títulos y un boceto. Cambia una frase que afirme una mejora sin evidencia por una opción que pueda probarse. [METODOLOGIA]", "scene": "learning-feedback", "sceneParams": {"title": "Muestra cómo una revisión cambia el relato", "a": "Borrador", "b": "Objeción", "c": "Cambio", "d": "Prueba"}, "facilitatorNotes": "Revela primero el borrador y después la revisión. Explica el criterio que motivó el cambio. Plan B manual: lee ambas versiones impresas y dibuja la escena en una hoja.", "demonstration": "Borrador: «El registro resolverá todos los problemas». Revisión: «Probemos un registro común con responsable y estado». Marca la revisión como propuesta pendiente de observación. [SUPUESTO]", "checkpoints": [{"question": "¿Por qué cambió la frase?", "answer": "La primera garantizaba un resultado; la segunda propone una prueba revisable.", "criterion": "Identifica la garantía sin evidencia y el criterio de revisión."}], "acceptance": ["La versión revisada conserva una decisión y evita garantizar un resultado."]}, {"id": "consigna", "title": "Completa tu contexto y conserva el criterio", "durationMinutes": 2, "body": "Elige el caso ficticio o un caso propio sin información privada. Copia el prompt y revisa que coincida con los tres campos editables. También puedes resolverlo en papel, sin modelo. [METODOLOGIA]", "scene": "learning-practice", "sceneParams": {"title": "Completa tu contexto y conserva el criterio", "a": "Contexto", "b": "Audiencia", "c": "Decisión", "d": "Criterio"}, "facilitatorNotes": "Demuestra la edición de un campo y la copia exacta del texto resultante. Indica que el prompt guía un borrador: su salida requiere revisión. Ofrece la misma consigna impresa cuando no haya tecnología.", "fields": [{"key": "contexto", "label": "Contexto de trabajo", "default": "un equipo ficticio registra solicitudes en varios lugares"}, {"key": "audiencia", "label": "Audiencia que decide", "default": "coordinación del equipo"}, {"key": "decision", "label": "Decisión que propones", "default": "elegir un registro común usando herramientas existentes"}], "prompt": "CONTEXTO: {{contexto}}\nAUDIENCIA: {{audiencia}}\nDECISIÓN: {{decision}}\nTAREA: redacta un brief, cuatro títulos conectados y un boceto descrito en palabras.\nCRITERIO: el brief nombra audiencia, decisión y restricción; cada título aporta un avance; el boceto representa una relación; toda ausencia permanece como pregunta.\nREGLAS: no inventes datos ni resultados, no incluyas información privada y etiqueta los supuestos.\nENTREGA: brief, títulos, boceto y una pregunta pendiente.\nREVISIÓN: explica qué revisarías antes de presentar.\nPuedes completar la misma tarea en papel, sin utilizar un modelo.", "practice": "Completa los tres campos y copia la consigna. Entregable: prompt o ficha de papel con contexto, audiencia y decisión. [SUPUESTO]", "acceptance": ["El texto copiado coincide con los valores editados y conserva tarea, criterio y reglas."]}, {"id": "practica-individual", "title": "Prepara un borrador que pueda revisarse", "durationMinutes": 15, "body": "Tiempo de práctica individual. Entrega un brief breve, cuatro títulos, un boceto y una pregunta pendiente. El tiempo propuesto organiza la sesión y puede ajustarse por brief. [SUPUESTO]", "scene": "learning-practice", "sceneParams": {"title": "Prepara un borrador que pueda revisarse", "a": "Brief", "b": "Cuatro títulos", "c": "Boceto", "d": "Pregunta"}, "facilitatorNotes": "Inicia el timebox sólo cuando las instrucciones estén claras. Pausa si el grupo necesita una aclaración. Ofrece el caso ficticio y la ficha de papel; ayuda con la decisión antes de ayudar con el diseño.", "practice": "Usa la ficha anterior para producir tu borrador. Entregable: brief, cuatro títulos ordenados, una relación visual dibujada y una pregunta que aún necesita respuesta. [SUPUESTO]", "acceptance": ["El brief contiene audiencia, decisión y restricción.", "Los cuatro títulos se relacionan con la misma decisión.", "El boceto tiene etiquetas y no incorpora datos inventados.", "La pregunta pendiente permanece visible."], "exemplar": "Boceto posible: solicitud → responsable → estado → revisión. Es una propuesta ficticia que requiere prueba. [SUPUESTO]"}, {"id": "revision-pares", "title": "Escucha la interpretación de otra persona", "durationMinutes": 4, "body": "En parejas, una persona presenta su relato y otra explica la decisión que entendió. Después intercambian roles. Las sugerencias señalan cambios del artefacto, no calificaciones personales. [SUPUESTO]", "scene": "team-roles", "sceneParams": {"title": "Escucha la interpretación de otra persona", "a": "Presenta", "b": "Reformula", "c": "Pregunta", "d": "Intercambia"}, "facilitatorNotes": "Inicia el timebox al formar parejas. Da dos minutos por rol y permite pausar. Quien escucha primero reformula la decisión; después formula una pregunta. Si alguien trabaja solo, usa la ficha del ejemplo como contraste.", "practice": "Presenta tu relato a otra persona. Entregable: escribe su reformulación y una pregunta que te haya hecho; luego intercambia el rol. [SUPUESTO]", "acceptance": ["La revisión registra una decisión interpretada y una pregunta concreta.", "La pregunta apunta a una ausencia o a una opción del brief."], "reflection": "¿Qué entendió la otra persona de forma distinta a lo que querías expresar?"}, {"id": "revision-propia", "title": "Edita una pieza con un motivo explícito", "durationMinutes": 3, "body": "Elige un cambio a partir de la revisión: brief, título o relación visual. Explica qué criterio te hizo editarlo y conserva la versión anterior. [METODOLOGIA]", "scene": "learning-feedback", "sceneParams": {"title": "Edita una pieza con un motivo explícito", "a": "Antes", "b": "Criterio", "c": "Edición", "d": "Después"}, "facilitatorNotes": "Pide un cambio concreto y su motivo. No exijas rehacer todo el borrador. Mantén juntas ambas versiones para que el participante pueda mostrar qué revisó.", "practice": "Edita un elemento y guarda el antes y el después. Entregable: ambas versiones y una frase que vincule el cambio con el criterio elegido. [SUPUESTO]", "acceptance": ["El cambio es visible en el artefacto.", "El motivo nombra uno de los criterios del taller."]}, {"id": "debrief", "title": "Explica qué cambiarías en tu proceso", "durationMinutes": 2, "body": "Compara tu forma de preparar una presentación con el proceso que acabas de probar. Distingue una observación del ejercicio de una expectativa sobre el trabajo futuro. [METODOLOGIA]", "scene": "reflection-debrief", "sceneParams": {"title": "Explica qué cambiarías en tu proceso", "a": "Observación", "b": "Diferencia", "c": "Expectativa", "d": "Pregunta"}, "facilitatorNotes": "Recoge dos respuestas breves. Pide un ejemplo del borrador para cada observación. Si alguien promete ahorrar tiempo o mejorar resultados, solicita mantenerlo como expectativa pendiente de medición.", "reflection": "¿Qué cambió en tu borrador y qué evidencia local te permite afirmarlo?", "checkpoints": [{"question": "¿Qué puedes afirmar sobre este ejercicio?", "answer": "Qué editaste y qué criterio empleaste; sus efectos posteriores todavía requieren observación.", "criterion": "Distingue una edición comprobable de un resultado futuro supuesto."}]}, {"id": "transferencia", "title": "Acuerda una próxima prueba y su revisión", "durationMinutes": 2, "body": "Selecciona una próxima presentación y define qué revisarás después de usar el borrador. El compromiso es una acción de seguimiento, no una garantía de impacto. [METODOLOGIA]", "scene": "learning-transfer", "sceneParams": {"title": "Acuerda una próxima prueba y su revisión", "a": "Situación", "b": "Acción", "c": "Fecha", "d": "Revisión"}, "facilitatorNotes": "Pide una situación, una acción y una fecha de revisión sin registrar nombres ni información privada. Acepta «fecha por acordar» como decisión de seguimiento, no como placeholder del artefacto.", "transfer": "Escribe dónde usarás el brief, qué parte probarás y qué evidencia del artefacto revisarás después. Guarda el compromiso en tu ficha personal. [SUPUESTO]", "practice": "Redacta un compromiso de una frase con situación, acción y revisión. Entregable: una ficha de seguimiento que conservas tú. [SUPUESTO]", "acceptance": ["El compromiso nombra una acción y un criterio revisable.", "El seguimiento evita prometer resultados aún no observados."]}, {"id": "cierre", "title": "Lleva un borrador y una pregunta abierta", "durationMinutes": 2, "body": "Conserva tu brief, tus títulos, el boceto y el registro de revisión. La pieza permanece en borrador hasta la aprobación humana correspondiente. [METODOLOGIA]", "scene": "learning-closing", "sceneParams": {"title": "Lleva un borrador y una pregunta abierta", "a": "Brief", "b": "Relato", "c": "Boceto", "d": "Seguimiento"}, "facilitatorNotes": "Cierra recordando los productos, la próxima prueba y el gate humano. Ofrece el ejemplo neutral y las instrucciones offline como respaldo. No distribuyas ni publiques piezas de participantes sin autorización.", "reflection": "¿Qué pregunta debes responder antes de mostrar tu presentación?", "acceptance": ["El participante puede mostrar sus productos y la revisión pendiente."], "transfer": "Antes de presentar, revisa procedencia, legibilidad y permisos con la persona responsable. [METODOLOGIA]"}], "facts": [], "pieces": [], "outputs": ["desktop", "mobile", "audience", "mobile-audience", "markdown"], "meta": {"status": "RENDERED_DRAFT", "contentOrigin": "Original own editorial construction; functional facilitation reference only.", "timingEvidence": "La duración y los timeboxes son decisiones de diseño. [SUPUESTO]", "modelRequirement": "Optional; all participant work can be completed manually offline."}, "_mobile": false}, "kind": "workshop-immersive", "brand": {"name": "Tu marca", "colors": {"night": "#152238", "gold": "#334155", "white": "#ffffff"}, "tokens": {"ink": "#152238", "accent": "#334155", "accentFill": "#dbe4ed", "canvas": "#f8fafc", "surface": "#ffffff", "surfaceAlt": "#f1f5f9", "muted": "#576472", "textSoft": "#334155", "border": "#cbd5e1", "inkOnDark": "#f5f7fa", "goldOnDark": "#e2e8f0", "darkSurface": "#152238", "softOnDark": "#cbd5e1"}}, "shellUi": {"es": ["Revisión humana pendiente", "Saltar al contenido", "Idioma", "Secciones", "Estado"], "en": ["Human review pending", "Skip to content", "Language", "Sections", "State"], "pt": ["Revisão humana pendente", "Ir para o conteúdo", "Idioma", "Seções", "Estado"], "fr": ["Relecture humaine en attente", "Aller au contenu", "Langue", "Sections", "État"]}, "assets": {"apertura:scene:learning-opening:es": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 540\" role=\"img\" aria-label=\"Presenta para lograr una decisión\">\u003ctext x=\"480\" y=\"48\" text-anchor=\"middle\" font-size=\"28\" font-weight=\"700\" fill=\"#152238\" class=\"scene-layer layer-0\">Presenta para lograr una decisión\u003c/text>\u003cpath d=\"M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3zM12 6v15M6 8h3M15 8h3M6 12h3M15 12h3\" transform=\"translate(445 66) scale(2.8)\" fill=\"none\" stroke-width=\"1.3\" stroke=\"#334155\" class=\"scene-layer layer-0\" />\u003cline x1=\"120\" y1=\"275\" x2=\"350\" y2=\"275\" stroke-width=\"3\" stroke=\"#64748b\" class=\"scene-layer layer-0\" />\u003cpath d=\"M247.00 275.00L227.63 281.75L227.63 268.25Z\" stroke-width=\"1\" fill=\"#334155\" class=\"scene-layer layer-0\" />\u003cline x1=\"350\" y1=\"275\" x2=\"580\" y2=\"275\" stroke-width=\"3\" stroke=\"#64748b\" class=\"scene-layer layer-0\" />\u003cpath d=\"M477.00 275.00L457.63 281.75L457.63 268.25Z\" stroke-width=\"1\" fill=\"#334155\" class=\"scene-layer layer-1\" />\u003cline x1=\"580\" y1=\"275\" x2=\"810\" y2=\"275\" stroke-width=\"3\" stroke=\"#64748b\" class=\"scene-layer layer-1\" />\u003cpath d=\"M707.00 275.00L687.63 281.75L687.63 268.25Z\" stroke-width=\"1\" fill=\"#334155\" class=\"scene-layer layer-1\" />\u003crect x=\"18\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" stroke-width=\"2\" fill=\"#ffffff\" class=\"scene-layer layer-1\" />\u003crect x=\"18\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke=\"#152238\" class=\"scene-layer layer-1\" />\u003ctext x=\"120\" y=\"282\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#152238\" class=\"scene-layer layer-2\">Audiencia\u003c/text>\u003crect x=\"248\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" stroke-width=\"2\" fill=\"#ffffff\" class=\"scene-layer layer-2\" />\u003crect x=\"248\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke=\"#152238\" class=\"scene-layer layer-2\" />\u003ctext x=\"350\" y=\"282\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#152238\" class=\"scene-layer layer-2\">Decisión\u003c/text>\u003crect x=\"478\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" stroke-width=\"2\" fill=\"#ffffff\" class=\"scene-layer layer-2\" />\u003crect x=\"478\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke=\"#152238\" class=\"scene-layer layer-3\" />\u003ctext x=\"580\" y=\"282\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#152238\" class=\"scene-layer layer-3\">Relato\u003c/text>\u003crect x=\"708\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" stroke-width=\"2\" fill=\"#ffffff\" class=\"scene-layer layer-3\" />\u003crect x=\"708\" y=\"241\" width=\"204\" height=\"68\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke=\"#334155\" class=\"scene-layer layer-3\" />\u003ctext x=\"810\" y=\"282\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\" fill=\"#152238\" class=\"scene-layer layer-3\">Revisión\u003c/text>\u003c/svg>", "apertura:scene:learning-opening:es:mobile": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 740\" role=\"img\" aria-label=\"Presenta para lograr una decisión\">\u003ctext x=\"210\" y=\"46\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"700\" fill=\"#152238\" class=\"scene-layer layer-0\">\u003ctspan x=\"210\" y=\"34.0\">Presenta para lograr una\u003c/tspan>\u003ctspan x=\"210\" y
