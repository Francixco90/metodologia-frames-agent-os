  adaptation_notes: >
    Orquestador freeform: autor un video custom cuando ningún workflow
    especializado encaja — brand reels, sizzle reels, montajes, multi-scene
    pieces, static loops, title cards, footage remixes, freeform builds.
    Companion (co-create, ceiling treatment first) o automation (choose + execute)
    flow. Storyboard yes/no review surface. Sub-agent dispatch scale-dependent
    (inline si ≤6 short scenes; fan out 2-3 scenes/worker, una sola wave si más).
    Composition via content-os-core (HTML+GSAP seekable). Lint via
    content-os-keyframes. Blueprints/rules via content-os-animation. Brand +
    genre lenses via content-os-creative. Media via content-os-media (offline
    default; remote opt-in auth-gated). Blocks via content-os-registry. Scope
    exact (no scope creep). Render only after approval. Output RENDERED_DRAFT
    (MP4), no HUMAN_APPROVED.
