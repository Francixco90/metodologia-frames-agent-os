version: 1
policy: one-writer-per-path
writers:
  lead:
    - README.md
    - AGENTS.md
    - CONTRIBUTING.md
    - SECURITY.md
    - docs/**
    - registries/projects/**
    - projects/_template/**
    - projects/vs-001-source-to-campaign/project.yml
  repo:
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - tsconfig.json
    - eslint.config.js
    - .prettierrc.json
    - .gitignore
    - .nvmrc
    - .npmrc
    - .github/**
    - scripts/**
  sources:
    - inbox/**
    - adapters/notebooklm/**
    - registries/sources/**
    - registries/notebooks/**
    - registries/claims/**
    - receipts/imports/**
    - projects/vs-001-source-to-campaign/source-bundle.yml
