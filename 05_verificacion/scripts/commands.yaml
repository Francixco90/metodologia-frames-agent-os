# commands-v1 — manifiesto versionado gate → comando.
# Fuente original: CLAUDE.md L29-44 (tabla gate → comando existente).
# Gates G13-G17 son manuales por diseño fail-closed (no automatizables).
# Gates intermedios (_PRECLEAR, _BRAND, _CONTRACTS, _CAROUSEL, _AI_RUNTIME, G10, G11)
# mapeados a scripts existentes en package.json; ver [SUPUESTO] en notas del PR.
# Comandos compuestos (no son gates): Preflight VS-001 → pnpm slice:build;
# Verificación total → pnpm verify. Quedan fuera del manifiesto (no son gates del DAG).

