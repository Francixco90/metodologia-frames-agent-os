caption: |-
  Empieza por el resultado, no por la herramienta.

  1. Define qué decisión, conducta o proceso quieres mejorar.
  2. Elige un cambio pequeño que reduzca fricción y pueda sostenerse.
  3. Usa la tecnología para automatizar lo repetible y conserva el juicio humano donde importa.

  Evidencia honesta: observa ciclo, adopción y retrabajo como indicadores sugeridos. Sin línea base, dueño, frecuencia y umbral, no son resultados.

  Escribe hoy el resultado que quieres mejorar y la señal que revisarás esta semana.
deck_alt_text: |-
  Carrusel de ocho tarjetas de MetodologIA. Abre con “Método antes que herramientas”, explica el riesgo del enfoque centrado en herramientas, desarrolla tres pilares —resultado, intención y tecnología aliada—, propone medir ciclo, adopción y retrabajo sin inventar resultados, resume tres pasos y cierra con una acción para esta semana.
